<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="format-detection" content="telephone=no">
<title>考研工作台 · 浙大药学</title>
<style>
:root{
  --m-pink:#f4b6c2;
  --m-pink-d:#e89aa8;
  --m-pink-l:#fde4ea;
  --m-blue:#a8c8e8;
  --m-blue-d:#7da8d4;
  --m-blue-l:#dceaf7;
  --m-mint:#a8dcc8;
  --m-mint-d:#7cc4a8;
  --m-mint-l:#d8f0e8;
  --m-lav:#c5b6e8;
  --m-lav-d:#a394d4;
  --m-lav-l:#ebe4f7;
  --m-yellow:#f7d99e;
  --m-yellow-d:#e8c279;
  --m-yellow-l:#fdf0d8;
  --m-peach:#fcc4a8;
  --m-peach-d:#f0a584;
  --m-peach-l:#fde8dc;
  --primary:#a8dcc8;
  --primary-d:#7cc4a8;
  --primary-l:#d8f0e8;
  --accent:#f4b6c2;
  --accent-d:#e89aa8;
  --danger:#e88a8a;
  --success:#8acca8;
  --text-1:#4a4a5a;
  --text-2:#7a7a8a;
  --text-3:#aaaaba;
  --bg:#f8f5fa;
  --card:#ffffff;
  --border:#eee8f0;
  --shadow:0 4px 16px rgba(180,160,200,.10);
  --shadow-lg:0 10px 30px rgba(180,160,200,.16);
  --radius:20px;
  --radius-sm:14px;
  --radius-xs:10px;
  --safe-top:env(safe-area-inset-top,0px);
  --safe-bottom:env(safe-area-inset-bottom,0px);
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{height:100%;overflow:hidden;}
body{
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","PingFang SC","Helvetica Neue",sans-serif;
  background:var(--bg);
  color:var(--text-1);
  font-size:15px;
  line-height:1.55;
  -webkit-font-smoothing:antialiased;
}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit;font-size:inherit;}
input,textarea,select{font-family:inherit;font-size:inherit;color:inherit;}
::-webkit-scrollbar{width:0;height:0;}
img{max-width:100%;}

#app{position:relative;width:100%;height:100vh;height:100dvh;overflow:hidden;}

.topbar{
  position:fixed;top:0;left:0;right:0;z-index:100;
  height:calc(54px + var(--safe-top));
  padding-top:var(--safe-top);
  background:linear-gradient(135deg,var(--m-mint-d),var(--m-blue-d));
  color:#fff;
  display:flex;align-items:center;
  padding-left:14px;padding-right:14px;
  box-shadow:0 2px 12px rgba(124,196,168,.2);
}
.topbar .menu-btn{
  width:38px;height:38px;
  display:flex;align-items:center;justify-content:center;
  border-radius:12px;transition:background .2s;
}
.topbar .menu-btn:active{background:rgba(255,255,255,.2);}
.topbar .menu-btn svg{width:22px;height:22px;}
.topbar .title{flex:1;text-align:center;font-size:16px;font-weight:600;letter-spacing:.3px;}
.topbar .right-slot{width:38px;}

.drawer-mask{
  position:fixed;inset:0;z-index:200;
  background:rgba(80,60,90,.35);
  opacity:0;visibility:hidden;
  transition:opacity .3s,visibility .3s;
  backdrop-filter:blur(3px);
}
.drawer-mask.open{opacity:1;visibility:visible;}
.drawer{
  position:fixed;top:0;left:0;bottom:0;z-index:201;
  width:270px;
  background:linear-gradient(180deg,#fff,var(--m-mint-l));
  color:var(--text-1);
  transform:translateX(-100%);
  transition:transform .32s cubic-bezier(.4,0,.2,1);
  display:flex;flex-direction:column;
  padding-top:var(--safe-top);
  box-shadow:4px 0 30px rgba(0,0,0,.1);
}
.drawer.open{transform:translateX(0);}
.drawer-header{
  padding:26px 20px 16px;
  background:linear-gradient(135deg,var(--m-mint-d),var(--m-blue-d));
  color:#fff;
  border-radius:0 0 24px 24px;
  margin-bottom:8px;
}
.drawer-header .avatar{
  width:50px;height:50px;border-radius:50%;
  background:rgba(255,255,255,.25);
  display:flex;align-items:center;justify-content:center;
  font-size:22px;font-weight:700;
  margin-bottom:10px;
}
.drawer-header .name{font-size:17px;font-weight:600;}
.drawer-header .sub{font-size:12px;opacity:.9;margin-top:3px;}

.drawer-nav{flex:1;overflow-y:auto;padding:8px 0 calc(16px + var(--safe-bottom));}
.nav-group-title{
  padding:12px 20px 6px;
  font-size:11px;font-weight:700;
  letter-spacing:1.5px;
  color:var(--text-3);
}
.nav-item{
  display:flex;align-items:center;gap:12px;
  padding:12px 20px;
  font-size:14px;
  transition:background .15s;
  position:relative;
}
.nav-item:active{background:var(--m-mint-l);}
.nav-item.active{background:var(--m-mint-l);}
.nav-item.active::before{
  content:'';position:absolute;left:0;top:10px;bottom:10px;
  width:3px;border-radius:0 3px 3px 0;background:var(--m-mint-d);
}
.nav-item .icon{width:32px;height:32px;border-radius:10px;display:flex;align-items:center;justify-content:center;background:var(--m-mint-l);color:var(--m-mint-d);flex-shrink:0;}
.nav-item .icon svg{width:18px;height:18px;}
.nav-item.sub-item{padding-left:48px;font-size:13px;padding-top:9px;padding-bottom:9px;}
.nav-item.sub-item .icon{width:28px;height:28px;border-radius:8px;font-size:12px;font-weight:600;}

.main{
  position:fixed;top:calc(54px + var(--safe-top));left:0;right:0;bottom:0;
  overflow-y:auto;-webkit-overflow-scrolling:touch;
}
.page{display:none;padding:14px 12px calc(90px + var(--safe-bottom));}
.page.active{display:block;animation:fadein .3s;}
@keyframes fadein{from{opacity:0;transform:translateY(6px);}to{opacity:1;transform:translateY(0);}}

.card{
  background:var(--card);
  border-radius:var(--radius);
  padding:16px;
  margin-bottom:12px;
  box-shadow:var(--shadow);
}
.card-title{
  font-size:15px;font-weight:600;
  color:var(--text-1);
  margin-bottom:12px;
  display:flex;align-items:center;gap:8px;
}
.card-title .dot{width:4px;height:15px;border-radius:2px;background:var(--m-mint-d);}

/* 首页 */
.hero-card{
  background:linear-gradient(135deg,var(--m-mint-d),var(--m-blue-d));
  color:#fff;
  border-radius:var(--radius);
  padding:20px 18px;
  margin-bottom:12px;
  position:relative;overflow:hidden;
  box-shadow:0 6px 20px rgba(124,196,168,.25);
}
.hero-card::after{
  content:'';position:absolute;right:-30px;top:-30px;
  width:130px;height:130px;border-radius:50%;
  background:rgba(255,255,255,.12);
}
.hero-card .label{font-size:12px;opacity:.9;margin-bottom:4px;}
.hero-card .countdown{font-size:40px;font-weight:700;line-height:1.1;}
.hero-card .countdown .unit{font-size:15px;font-weight:500;opacity:.85;margin-left:4px;}
.hero-card .exam-date{font-size:11px;opacity:.85;margin-top:6px;}
.hero-card .target{font-size:12px;opacity:.95;margin-top:4px;font-weight:500;}
.hero-card .progress-wrap{margin-top:12px;height:6px;border-radius:3px;background:rgba(255,255,255,.2);overflow:hidden;}
.hero-card .progress-bar{height:100%;border-radius:3px;background:linear-gradient(90deg,var(--m-yellow),#ffe4a8);}
.hero-card .progress-text{font-size:11px;opacity:.9;margin-top:5px;}

.stat-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px;}
.stat-card{background:var(--card);border-radius:var(--radius-sm);padding:14px 12px;box-shadow:var(--shadow);text-align:center;}
.stat-card .num{font-size:24px;font-weight:700;color:var(--m-blue-d);}
.stat-card .lbl{font-size:11px;color:var(--text-2);margin-top:3px;}

.quick-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:4px;}
.quick-item{
  background:var(--card);border-radius:var(--radius-sm);
  padding:12px 4px;text-align:center;box-shadow:var(--shadow);
  transition:transform .12s;
}
.quick-item:active{transform:scale(.95);}
.quick-item .qi-icon{width:34px;height:34px;border-radius:10px;margin:0 auto 5px;display:flex;align-items:center;justify-content:center;}
.quick-item .qi-icon svg{width:18px;height:18px;}
.quick-item .qi-label{font-size:11px;color:var(--text-2);}

.today-tasks-mini .task-item{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--border);}
.today-tasks-mini .task-item:last-child{border-bottom:none;}
.task-check{width:22px;height:22px;border-radius:50%;border:2px solid var(--m-mint);display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:all .2s;}
.task-check.done{background:var(--success);border-color:var(--success);}
.task-check svg{display:none;width:13px;height:13px;color:#fff;}
.task-check.done svg{display:block;}
.task-item .t-name{flex:1;font-size:14px;}
.task-item.done .t-name{text-decoration:line-through;color:var(--text-3);}
.task-item .t-tag{font-size:11px;padding:2px 8px;border-radius:8px;background:var(--m-mint-l);color:var(--m-mint-d);}

.subject-header{
  display:flex;align-items:center;gap:14px;
  border-radius:var(--radius);
  padding:18px;margin-bottom:14px;color:#fff;
}
.subject-header .sh-icon{width:48px;height:48px;border-radius:14px;background:rgba(255,255,255,.25);display:flex;align-items:center;justify-content:center;font-size:22px;font-weight:600;}
.subject-header .sh-info{flex:1;}
.subject-header .sh-name{font-size:18px;font-weight:600;}
.subject-header .sh-sub{font-size:12px;opacity:.9;margin-top:2px;}

.upload-zone{
  border:2px dashed var(--m-mint);
  border-radius:var(--radius-sm);
  padding:22px 16px;text-align:center;
  background:var(--m-mint-l);
  margin-bottom:12px;transition:all .2s;
}
.upload-zone:active{background:var(--m-mint);border-color:var(--m-mint-d);}
.upload-zone .uz-icon{width:42px;height:42px;margin:0 auto 6px;border-radius:50%;background:#fff;display:flex;align-items:center;justify-content:center;color:var(--m-mint-d);}
.upload-zone .uz-icon svg{width:22px;height:22px;}
.upload-zone .uz-text{font-size:14px;color:var(--text-1);font-weight:500;}
.upload-zone .uz-hint{font-size:12px;color:var(--text-3);margin-top:3px;}

.file-tabs{display:flex;gap:6px;margin-bottom:10px;overflow-x:auto;}
.file-tab{padding:6px 14px;border-radius:18px;font-size:12px;font-weight:500;background:var(--card);color:var(--text-2);border:1px solid var(--border);white-space:nowrap;transition:all .2s;}
.file-tab.active{background:var(--m-mint-d);color:#fff;border-color:var(--m-mint-d);}

.file-list{list-style:none;}
.file-item{display:flex;align-items:center;gap:10px;padding:12px;background:var(--card);border-radius:var(--radius-sm);margin-bottom:8px;box-shadow:var(--shadow);}
.file-item .fi-icon{width:38px;height:38px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:600;flex-shrink:0;}
.file-item .fi-icon.pdf{background:var(--m-peach-l);color:var(--m-peach-d);}
.file-item .fi-icon.video{background:var(--m-lav-l);color:var(--m-lav-d);}
.file-item .fi-info{flex:1;min-width:0;}
.file-item .fi-name{font-size:13px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.file-item .fi-meta{font-size:11px;color:var(--text-3);margin-top:2px;}
.file-item .fi-actions{display:flex;gap:5px;}
.file-item .fi-btn{width:32px;height:32px;border-radius:8px;display:flex;align-items:center;justify-content:center;background:var(--m-mint-l);color:var(--m-mint-d);}
.file-item .fi-btn:active{background:var(--m-mint);}
.file-item .fi-btn svg{width:16px;height:16px;}
.file-item .fi-btn.del{color:var(--danger);background:var(--m-pink-l);}

.empty-state{text-align:center;padding:28px 16px;color:var(--text-3);}
.empty-state .es-icon{font-size:36px;margin-bottom:6px;opacity:.6;}
.empty-state .es-text{font-size:13px;}

/* 计划 */
.plan-date{text-align:center;font-size:12px;color:var(--text-2);margin-bottom:12px;}
.plan-add{display:flex;gap:6px;margin-bottom:12px;}
.plan-add input{flex:1;padding:10px 12px;border:1px solid var(--border);border-radius:var(--radius-sm);background:var(--card);font-size:14px;outline:none;}
.plan-add input:focus{border-color:var(--m-mint-d);}
.plan-add select{padding:10px 6px;border:1px solid var(--border);border-radius:var(--radius-sm);background:var(--card);font-size:12px;color:var(--text-2);outline:none;}
.plan-add button{width:40px;background:var(--m-mint-d);color:#fff;border-radius:var(--radius-sm);font-size:20px;display:flex;align-items:center;justify-content:center;}
.plan-progress{display:flex;align-items:center;gap:10px;margin-bottom:12px;padding:14px;background:var(--m-mint-l);border-radius:var(--radius-sm);}
.plan-progress .pp-circle{position:relative;width:46px;height:46px;flex-shrink:0;}
.plan-progress .pp-circle svg{width:46px;height:46px;transform:rotate(-90deg);}
.plan-progress .pp-circle .pp-num{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:600;color:var(--m-mint-d);}
.plan-progress .pp-text{flex:1;}
.plan-progress .pp-text .pt-main{font-size:13px;font-weight:500;}
.plan-progress .pp-text .pt-sub{font-size:12px;color:var(--text-2);margin-top:2px;}
.plan-item{display:flex;align-items:center;gap:10px;padding:13px;background:var(--card);border-radius:var(--radius-sm);margin-bottom:8px;box-shadow:var(--shadow);animation:slidein .25s;}
@keyframes slidein{from{opacity:0;transform:translateX(-8px);}to{opacity:1;transform:translateX(0);}}
.plan-item .pi-check{width:24px;height:24px;border-radius:50%;border:2px solid var(--m-mint);flex-shrink:0;display:flex;align-items:center;justify-content:center;transition:all .2s;}
.plan-item.done .pi-check{background:var(--success);border-color:var(--success);}
.plan-item.done .pi-check svg{width:13px;height:13px;color:#fff;display:block;}
.pi-check svg{display:none;}
.plan-item .pi-content{flex:1;}
.plan-item .pi-name{font-size:14px;}
.plan-item.done .pi-name{text-decoration:line-through;color:var(--text-3);}
.plan-item .pi-tag{display:inline-block;font-size:11px;padding:2px 7px;border-radius:8px;margin-top:3px;background:var(--m-mint-l);color:var(--m-mint-d);}
.plan-item .pi-del{width:28px;height:28px;color:var(--text-3);display:flex;align-items:center;justify-content:center;}
.plan-item .pi-del:active{color:var(--danger);}
.plan-item .pi-del svg{width:16px;height:16px;}

/* 番茄 */
.pomodoro-wrap{text-align:center;padding:16px 0;}
.pomo-mode-tabs{display:flex;gap:6px;justify-content:center;margin-bottom:18px;}
.pomo-mode-tab{padding:6px 16px;border-radius:18px;font-size:12px;font-weight:500;background:var(--card);color:var(--text-2);box-shadow:var(--shadow);}
.pomo-mode-tab.active{background:var(--m-mint-d);color:#fff;}
.pomo-clock{width:210px;height:210px;margin:0 auto 20px;position:relative;}
.pomo-clock svg{width:100%;height:100%;transform:rotate(-90deg);}
.pomo-clock .pomo-ring-bg{fill:none;stroke:var(--m-mint-l);stroke-width:8;}
.pomo-clock .pomo-ring{fill:none;stroke:var(--m-mint-d);stroke-width:8;stroke-linecap:round;transition:stroke-dashoffset .8s linear;}
.pomo-clock .pomo-time{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;}
.pomo-clock .pomo-time .pt-time{font-size:42px;font-weight:300;color:var(--text-1);letter-spacing:2px;}
.pomo-clock .pomo-time .pt-label{font-size:12px;color:var(--text-3);margin-top:4px;}
.pomo-controls{display:flex;gap:14px;justify-content:center;}
.pomo-btn{width:54px;height:54px;border-radius:50%;display:flex;align-items:center;justify-content:center;box-shadow:var(--shadow-lg);transition:transform .15s;}
.pomo-btn:active{transform:scale(.92);}
.pomo-btn svg{width:22px;height:22px;}
.pomo-btn.primary{background:var(--m-mint-d);color:#fff;}
.pomo-btn.secondary{background:var(--card);color:var(--m-mint-d);}
.pomo-stats{display:flex;justify-content:center;gap:28px;margin-top:20px;padding:14px;background:var(--m-mint-l);border-radius:var(--radius-sm);}
.pomo-stat .ps-num{font-size:20px;font-weight:700;color:var(--m-mint-d);}
.pomo-stat .ps-lbl{font-size:11px;color:var(--text-2);margin-top:2px;}

/* 倒计时 */
.countdown-big{text-align:center;padding:28px 18px;border-radius:var(--radius);color:#fff;margin-bottom:12px;position:relative;overflow:hidden;background:linear-gradient(135deg,var(--m-pink-d),var(--m-lav-d));}
.countdown-big::after{content:'';position:absolute;right:-40px;bottom:-40px;width:150px;height:150px;border-radius:50%;background:rgba(255,255,255,.1);}
.countdown-big .cb-label{font-size:13px;opacity:.9;margin-bottom:6px;}
.countdown-big .cb-days{font-size:68px;font-weight:700;line-height:1;letter-spacing:2px;}
.countdown-big .cb-unit{font-size:18px;font-weight:500;opacity:.85;}
.countdown-big .cb-date{font-size:12px;opacity:.85;margin-top:8px;}
.cd-detail-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:12px;}
.cd-detail{background:var(--card);border-radius:var(--radius-sm);padding:14px 6px;text-align:center;box-shadow:var(--shadow);}
.cd-detail .cd-num{font-size:22px;font-weight:700;color:var(--m-blue-d);}
.cd-detail .cd-lbl{font-size:11px;color:var(--text-2);margin-top:3px;}
.cd-milestones .ms-item{display:flex;align-items:center;gap:10px;padding:11px 0;border-bottom:1px solid var(--border);}
.cd-milestones .ms-item:last-child{border-bottom:none;}
.cd-milestones .ms-dot{width:10px;height:10px;border-radius:50%;background:var(--m-yellow-d);flex-shrink:0;}
.cd-milestones .ms-item.passed .ms-dot{background:var(--success);}
.cd-milestones .ms-item .ms-info{flex:1;}
.cd-milestones .ms-item .ms-name{font-size:14px;font-weight:500;}
.cd-milestones .ms-item .ms-date{font-size:12px;color:var(--text-3);}
.cd-milestones .ms-item .ms-days{font-size:13px;font-weight:600;color:var(--m-mint-d);}

/* 速算 */
.calc-mode-tabs{display:flex;gap:6px;margin-bottom:12px;}
.calc-mode-tab{flex:1;padding:9px;border-radius:var(--radius-sm);text-align:center;font-size:12px;font-weight:500;background:var(--card);color:var(--text-2);box-shadow:var(--shadow);}
.calc-mode-tab.active{background:var(--m-mint-d);color:#fff;}
.calc-card{background:var(--card);border-radius:var(--radius);padding:22px;box-shadow:var(--shadow);text-align:center;}
.calc-question{font-size:38px;font-weight:700;color:var(--text-1);margin-bottom:18px;letter-spacing:2px;}
.calc-input{width:100%;padding:13px;font-size:22px;text-align:center;border:2px solid var(--border);border-radius:var(--radius-sm);outline:none;margin-bottom:12px;transition:border-color .2s;}
.calc-input:focus{border-color:var(--m-mint-d);}
.calc-input.correct{border-color:var(--success);background:var(--m-mint-l);}
.calc-input.wrong{border-color:var(--danger);background:var(--m-pink-l);}
.calc-submit{width:100%;padding:13px;background:var(--m-mint-d);color:#fff;border-radius:var(--radius-sm);font-size:14px;font-weight:500;}
.calc-stats-bar{display:flex;justify-content:space-around;margin-top:14px;padding:14px;background:var(--m-mint-l);border-radius:var(--radius-sm);}
.calc-stat .cs-num{font-size:18px;font-weight:700;color:var(--m-mint-d);}
.calc-stat .cs-lbl{font-size:11px;color:var(--text-2);margin-top:2px;}
.calc-feedback{font-size:13px;margin-top:8px;min-height:18px;}
.calc-feedback.right{color:var(--success);}
.calc-feedback.wrong{color:var(--danger);}

/* 默写 */
.recite-subject-tabs{display:flex;gap:6px;margin-bottom:12px;overflow-x:auto;}
.recite-subject-tab{padding:6px 13px;border-radius:16px;font-size:12px;white-space:nowrap;background:var(--card);color:var(--text-2);box-shadow:var(--shadow);}
.recite-subject-tab.active{background:var(--m-mint-d);color:#fff;}
.recite-item{background:var(--card);border-radius:var(--radius);padding:16px;box-shadow:var(--shadow);margin-bottom:12px;}

// 数据层 IndexedDB
var DB_NAME="ZJU_Kaoyan",DB_VERSION=1,db=null;
function openDB(){return new Promise(function(resolve,reject){
  if(!window.indexedDB){resolve(null);return;}
  var req=indexedDB.open(DB_NAME,DB_VERSION);
  req.onupgradeneeded=function(e){
    var d=e.target.result;
    if(!d.objectStoreNames.contains("files"))d.createObjectStore("files",{keyPath:"id"});
    if(!d.objectStoreNames.contains("data"))d.createObjectStore("data",{keyPath:"key"});
  };
  req.onsuccess=function(e){db=e.target.result;resolve(db);};
  req.onerror=function(e){resolve(null);};
});}
function dbPut(store,val){return new Promise(function(res){
  if(!db){res();return;}
  var tx=db.transaction(store,"readwrite");tx.objectStore(store).put(val);
  tx.oncomplete=function(){res();};tx.onerror=function(){res();};
});}
function dbGet(store,key){return new Promise(function(res){
  if(!db){res(null);return;}
  var tx=db.transaction(store,"readonly");var r=tx.objectStore(store).get(key);
  r.onsuccess=function(){res(r.result);};r.onerror=function(){res(null);};
});}
function dbGetAll(store){return new Promise(function(res){
  if(!db){res([]);return;}
  var tx=db.transaction(store,"readonly");var r=tx.objectStore(store).getAll();
  r.onsuccess=function(){res(r.result||[]);};r.onerror=function(){res([]);};
});}
function dbDelete(store,key){return new Promise(function(res){
  if(!db){res();return;}
  var tx=db.transaction(store,"readwrite");tx.objectStore(store).delete(key);
  tx.oncomplete=function(){res();};tx.onerror=function(){res();};
});}
function saveData(key,value){return dbPut("data",{key:key,value:value});}
function loadData(key,def){return dbGet("data",key).then(function(r){return r?r.value:def;});}

function goto(page){
  currentPage=page;
  renderPage(page);
  updateActiveNav(page);
  updateBottomBar(page);
  var titles={home:"考研工作台",plan:"每日计划",pomodoro:"番茄计时",countdown:"考研倒计时",calendar:"学习打卡",formula:"公式手册",calctitle:"药分计算",structcard:"药化结构式",mistakes:"易错知识点",recite:"大题默写",memo:"信息备忘录",ai:"AI助手"};
  $("pageTitle").textContent=titles[page]||"考研工作台";
}
function gotoSubject(id){
  currentPage="subject:"+id;
  renderSubjectPage(id);
  updateActiveNav("subject:"+id);
  updateBottomBar(null);
  var s=SUBJECTS.filter(function(x){return x.id===id;})[0];
  $("pageTitle").textContent=s?s.name:"科目";
}
function updateActiveNav(page){
  var items=document.querySelectorAll(".nav-item");
  for(var i=0;i<items.length;i++){
    items[i].classList.remove("active");
    if(items[i].dataset.page===page||items[i].dataset.tool===page)items[i].classList.add("active");
  }
}
function updateBottomBar(page){
  var items=document.querySelectorAll(".bb-item");
  for(var i=0;i<items.length;i++){
    items[i].classList.toggle("active",items[i].dataset.page===page);
  }
}

      for(var i=0;i<vs.length;i++)vs[i].addEventListener("click",function(){viewFile(this.dataset.view);});
      var ds=list.querySelectorAll("[data-del]");
      for(var i=0;i<ds.length;i++)ds[i].addEventListener("click",function(){
        if(confirm("确定删除这个文件吗？")){
          var id=this.dataset.del;
          dbDelete("files",id).then(function(){toast("已删除");renderSubjectPage(subjectId);});
        }
      });
    }
    renderFileList();

    var tabs=document.querySelectorAll(".file-tab");
    for(var i=0;i<tabs.length;i++)tabs[i].addEventListener("click",function(){
      var ts=document.querySelectorAll(".file-tab");
      for(var j=0;j<ts.length;j++)ts[j].classList.remove("active");
      this.classList.add("active");
      activeTab=this.dataset.tab;
      renderFileList();
    });

    $("uploadZone").addEventListener("click",function(){$("fileInput").click();});
    $("fileInput").addEventListener("change",function(e){
      var fileList=e.target.files;
      var promises=[];
      for(var i=0;i<fileList.length;i++){
        var file=fileList[i];
        var id="f_"+Date.now()+"_"+Math.random().toString(36).slice(2,8);
        var type=(file.type.indexOf("pdf")>=0||file.name.toLowerCase().indexOf(".pdf")>=0)?"pdf":"video";
        promises.push(dbPut("files",{
          id:id,subject:subjectId,name:file.name,size:file.size,type:type,blob:file,
          added:new Date().toLocaleDateString("zh-CN",{month:"short",day:"numeric"})
        }));
      }
      Promise.all(promises).then(function(){toast("上传成功");renderSubjectPage(subjectId);});
    });
  });
}

function formatSize(b){
  if(b<1024)return b+"B";
  if(b<1048576)return(b/1024).toFixed(1)+"KB";
  return(b/1048576).toFixed(1)+"MB";
}

function viewFile(id){
  dbGet("files",id).then(function(f){
    if(!f)return;
    if(fileViewerUrl)URL.revokeObjectURL(fileViewerUrl);
    var url=URL.createObjectURL(f.blob);
    fileViewerUrl=url;
    $("viewerTitle").textContent=f.name;
    if(f.type==="pdf"){
      $("viewerBody").innerHTML='<iframe src="'+url+'#toolbar=0"></iframe>';
    }else{
      $("viewerBody").innerHTML='<video src="'+url+'" controls autoplay></video>';
    }
    $("viewerMask").classList.add("open");
  });
}
$("viewerClose").addEventListener("click",function(){
  $("viewerMask").classList.remove("open");
  $("viewerBody").innerHTML="";
  if(fileViewerUrl){URL.revokeObjectURL(fileViewerUrl);fileViewerUrl=null;}
});

// 每日计划
function renderPlan(){
  loadData("plans",[]).then(function(plans){
    var today=new Date().toDateString();
    var todayPlans=plans.filter(function(p){return p.date===today;});
    var doneCount=todayPlans.filter(function(p){return p.done;}).length;
    var pct=todayPlans.length===0?0:Math.round(doneCount/todayPlans.length*100);

    $("main").innerHTML=
    '<div class="page active">'+
      '<div class="plan-date">'+new Date().toLocaleDateString("zh-CN",{year:"numeric",month:"long",day:"numeric",weekday:"long"})+'</div>'+
      '<div class="plan-progress">'+
        '<div class="pp-circle"><svg viewBox="0 0 46 46"><circle cx="23" cy="23" r="19" fill="none" stroke="var(--m-mint-l)" stroke-width="5"/><circle cx="23" cy="23" r="19" fill="none" stroke="var(--m-mint-d)" stroke-width="5" stroke-linecap="round" stroke-dasharray="'+(2*Math.PI*19)+'" stroke-dashoffset="'+(2*Math.PI*19*(1-pct/100))+'"/></svg><div class="pp-num">'+pct+'%</div></div>'+
        '<div class="pp-text"><div class="pt-main">今日完成 '+doneCount+'/'+todayPlans.length+'</div><div class="pt-sub">'+(pct===100?"全部完成，太棒了！":todayPlans.length===0?"添加你的第一个计划吧":"还有 "+(todayPlans.length-doneCount)+" 个任务待完成")+'</div></div>'+
      '</div>'+
      '<div class="plan-add"><input type="text" id="planInput" placeholder="添加学习任务..." /><select id="planSubject">'+SUBJECTS.map(function(s){return '<option value="'+s.name+'">'+s.name+'</option>';}).join("")+'<option value="通用" selected>通用</option></select><button id="planAddBtn">+</button></div>'+
      '<div id="planList"></div>'+
    '</div>';

    function renderPlanList(){
      var list=$("planList");
      if(todayPlans.length===0){list.innerHTML='<div class="empty-state"><div class="es-icon">🎯</div><div class="es-text">今日暂无计划</div></div>';return;}
      todayPlans.sort(function(a,b){return a.done-b.done;});
      list.innerHTML=todayPlans.map(function(p){
        return '<div class="plan-item '+(p.done?"done":"")+'" data-id="'+p.id+'">'+
          '<div class="pi-check"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><polyline points="20 6 9 17 4 12"/></svg></div>'+
          '<div class="pi-content"><div class="pi-name">'+p.name+'</div><span class="pi-tag">'+p.subject+'</span></div>'+
          '<div class="pi-del" data-del="'+p.id+'"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6"/></svg></div>'+
        '</div>';
      }).join("");
      var is=list.querySelectorAll("[data-id]");
      for(var i=0;i<is.length;i++)is[i].addEventListener("click",function(){
        var id=this.dataset.id;
        var p=plans.filter(function(x){return x.id===id;})[0];
        if(p){p.done=!p.done;saveData("plans",plans).then(function(){renderPlan();});}
      });
      var ds=list.querySelectorAll("[data-del]");
      for(var i=0;i<ds.length;i++)ds[i].addEventListener("click",function(e){
        e.stopPropagation();
        var id=this.dataset.del;
        var idx=plans.findIndex(function(x){return x.id===id;});
        if(idx>=0){plans.splice(idx,1);saveData("plans",plans).then(function(){renderPlan();});}
      });
    }
    renderPlanList();

    $("planAddBtn").addEventListener("click",function(){
      var input=$("planInput");
      var name=input.value.trim();
      if(!name){toast("请输入任务内容");return;}
      var subject=$("planSubject").value;
      plans.push({id:"p_"+Date.now(),name:name,subject:subject,done:false,date:today});
      saveData("plans",plans).then(function(){input.value="";renderPlan();});
    });
    $("planInput").addEventListener("keypress",function(e){if(e.key==="Enter")$("planAddBtn").click();});
  });
}

// 番茄钟
function renderPomodoro(){
  loadData("pomoCount",0).then(function(count){
    loadData("pomoToday_"+new Date().toDateString(),0).then(function(todayFocus){
      pomodoroState.running=false;
      if(pomodoroTimer){clearInterval(pomodoroTimer);pomodoroTimer=null;}

      $("main").innerHTML=
      '<div class="page active">'+
        '<div class="card"><div class="pomodoro-wrap">'+
          '<div class="pomo-mode-tabs">'+
            '<div class="pomo-mode-tab active" data-mode="focus" data-sec="'+(25*60)+'">专注 25分钟</div>'+
            '<div class="pomo-mode-tab" data-mode="short" data-sec="'+(5*60)+'">短休息 5分钟</div>'+
            '<div class="pomo-mode-tab" data-mode="long" data-sec="'+(15*60)+'">长休息 15分钟</div>'+
          '</div>'+
          '<div class="pomo-clock"><svg viewBox="0 0 210 210"><circle class="pomo-ring-bg" cx="105" cy="105" r="95"/><circle class="pomo-ring" cx="105" cy="105" r="95" id="pomoRing" stroke-dasharray="'+(2*Math.PI*95)+'" stroke-dashoffset="0"/></svg><div class="pomo-time"><div class="pt-time" id="pomoTime">25:00</div><div class="pt-label" id="pomoLabel">准备开始专注</div></div></div>'+
          '<div class="pomo-controls">'+
            '<div class="pomo-btn secondary" id="pomoReset"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="1 4 1 10 7 10"/><path d="M3.51 15a9 9 0 1 0 2.13-9.36L1 10"/></svg></div>'+
            '<div class="pomo-btn primary" id="pomoStart"><svg viewBox="0 0 24 24" fill="currentColor"><polygon points="6 4 20 12 6 20"/></svg></div>'+
            '<div class="pomo-btn secondary" id="pomoSkip" style="display:none"><svg viewBox="0 0 24 24" fill="currentColor"><polygon points="5 4 15 12 5 20"/><rect x="17" y="4" width="2" height="16"/></svg></div>'+
          '</div>'+
          '<div class="pomo-stats"><div class="pomo-stat"><div class="ps-num">'+count+'</div><div class="ps-lbl">累计番茄</div></div><div class="pomo-stat"><div class="ps-num">'+todayFocus+'</div><div class="ps-lbl">今日专注</div></div></div>'+
        '</div></div>'+
        '<div class="card"><div class="card-title"><span class="dot"></span>使用说明</div><div style="font-size:13px;color:var(--text-2);line-height:1.8;"><b>专注</b>：25分钟集中学习，不看手机<br><b>短休息</b>：5分钟放松，站起来活动<br><b>长休息</b>：每完成4个番茄后休息15分钟<br>完成一个专注番茄会自动计数，坚持就是胜利！</div></div>'+
      '</div>';

      var ringEl=$("pomoRing"),timeEl=$("pomoTime"),labelEl=$("pomoLabel");
      var startBtn=$("pomoStart"),resetBtn=$("pomoReset"),skipBtn=$("pomoSkip");
      var ringLen=2*Math.PI*95;

      function updateDisplay(){
        var m=Math.floor(pomodoroState.seconds/60),s=pomodoroState.seconds%60;
        timeEl.textContent=(m<10?"0":"")+m+":"+(s<10?"0":"")+s;
        var pct=pomodoroState.total>0?(1-pomodoroState.seconds/pomodoroState.total):0;
        ringEl.style.strokeDashoffset=ringLen*pct;
        var labels={focus:"专注中",short:"短休息",long:"长休息"};
        labelEl.textContent=pomodoroState.running?labels[pomodoroState.mode]:(pomodoroState.seconds===pomodoroState.total?"准备开始"+labels[pomodoroState.mode]:"已暂停");
      }
      updateDisplay();

      function start(){
        if(pomodoroState.running){
          clearInterval(pomodoroTimer);
          pomodoroState.running=false;
          startBtn.innerHTML='<svg viewBox="0 0 24 24" fill="currentColor"><polygon points="6 4 20 12 6 20"/></svg>';
        }else{
          pomodoroState.running=true;
          startBtn.innerHTML='<svg viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="4" width="4" height="16"/><rect x="14" y="4" width="4" height="16"/></svg>';
          skipBtn.style.display="flex";
          pomodoroTimer=setInterval(function(){
            pomodoroState.seconds--;
            if(pomodoroState.seconds<=0){
              clearInterval(pomodoroTimer);
              pomodoroState.running=false;
              startBtn.innerHTML='<svg viewBox="0 0 24 24" fill="currentColor"><polygon points="6 4 20 12 6 20"/></svg>';
              if(pomodoroState.mode==="focus"){
                loadData("pomoCount",0).then(function(c){
                  saveData("pomoCount",c+1).then(function(){
                    loadData("pomoToday_"+new Date().toDateString(),0).then(function(td){
                      saveData("pomoToday_"+new Date().toDateString(),td+1).then(function(){
                        toast("🍅 专注完成！该休息了");
                        renderPomodoro();
                      });
                    });
                  });
                });
              }else{
                toast("休息结束，继续加油！");
                renderPomodoro();
              }
              return;
            }
            updateDisplay();
          },1000);
        }
        updateDisplay();
      }
      startBtn.addEventListener("click",start);
      resetBtn.addEventListener("click",function(){
        if(pomodoroTimer){clearInterval(pomodoroTimer);pomodoroTimer=null;}
        pomodoroState.running=false;
        pomodoroState.seconds=pomodoroState.total;
        startBtn.innerHTML='<svg viewBox="0 0 24 24" fill="currentColor"><polygon points="6 4 20 12 6 20"/></svg>';
        skipBtn.style.display="none";
        updateDisplay();
      });
      skipBtn.addEventListener("click",function(){
        if(pomodoroTimer){clearInterval(pomodoroTimer);pomodoroTimer=null;}
        pomodoroState.running=false;
        if(pomodoroState.mode==="focus"){
          loadData("pomoCount",0).then(function(c){saveData("pomoCount",c+1).then(function(){toast("已跳过");renderPomodoro();});});
        }else{toast("已跳过");renderPomodoro();}
      });

      var tabs=document.querySelectorAll(".pomo-mode-tab");
      for(var i=0;i<tabs.length;i++)tabs[i].addEventListener("click",function(){
        if(pomodoroTimer){clearInterval(pomodoroTimer);pomodoroTimer=null;}
        var ts=document.querySelectorAll(".pomo-mode-tab");
        for(var j=0;j<ts.length;j++)ts[j].classList.remove("active");
        this.classList.add("active");
        pomodoroState.mode=this.dataset.mode;
        pomodoroState.total=parseInt(this.dataset.sec);
        pomodoroState.seconds=pomodoroState.total;
        pomodoroState.running=false;
        startBtn.innerHTML='<svg viewBox="0 0 24 24" fill="currentColor"><polygon points="6 4 20 12 6 20"/></svg>';
        skipBtn.style.display="none";
        updateDisplay();
      });
    });
  });
}

// 药分计算题练习
function genPhCalcQuestion(type){
  var q={};
  if(type==="titration"){
    // 难度升级：需要浓度校正因子F + 稀释倍数 + 分子量换算
    var F=(Math.floor(Math.random()*15)+95)/100; // 0.95-1.09
    var V=(Math.floor(Math.random()*150)+120)/10; // 12.0-26.9 mL
    var T=(Math.floor(Math.random()*40)+60)/10;   // 6.0-9.9 mg/mL
    var m=(Math.floor(Math.random()*300)+200)/100; // 2.00-4.99 g
    var dilute=(Math.floor(Math.random()*4)+2); // 稀释倍数 2-5
    var ans=(V*F*T*dilute/1000)/m*100;
    q.text="取本品 "+m+" g，配制成溶液后稀释 "+dilute+" 倍。用浓度为标示量 "+F.toFixed(2)+" 倍（校正因子F）的滴定液滴定，消耗 "+V.toFixed(1)+" mL。已知滴定度 T = "+T.toFixed(1)+" mg/mL（每1mL滴定液相当于"+T.toFixed(1)+"mg被测物）。计算被测物百分含量（%）。\n（提示：含量% = V×F×T×稀释倍数 / (m×1000) × 100%）";
    q.answer=Math.round(ans*100)/100;
    q.formula="含量% = (V×F×T×D)/(m×1000)×100% = ("+V.toFixed(1)+"×"+F.toFixed(2)+"×"+T.toFixed(1)+"×"+dilute+")/("+m+"×1000)×100% = "+q.answer+"%";
  }else if(type==="uv"){
    // 难度升级：吸收系数法 + 稀释倍数 + 标示量折算
    var A=(Math.floor(Math.random()*40)+40)/100;  // 0.40-0.79
    var E=Math.floor(Math.random()*200)+300;        // 300-499
    var dilute=Math.floor(Math.random()*5)+5;       // 5-9
    var label=Math.floor(Math.random()*100)+100;    // 标示量 mg/片 100-199
    var tabW=(Math.floor(Math.random()*30)+200)/100; // 片重 2.00-2.29 g... adjust
    var avgTab=(Math.floor(Math.random()*50)+250);   // 平均片重 250-299 mg
    // 浓度 C(g/100mL)=A/(E*L), L=1cm; 标示量% = C×稀释倍数×平均片重/标示量×100
    var C=A/(E*1); // g/100mL
    var ans=C*dilute*avgTab/label*100; // 但需统一单位 mg
    // 重算：A/(E*1) 得 g/100mL, ×稀释, 转换为 mg = ×1000×100? 简化如下:
    // 供试品溶液浓度(mg/mL) = A/E × 10 (因为E是E1%1cm, C单位g/100mL, 转mg/mL ×1000/100=10)
    var conc=A/E*10*dilute; // mg/mL = 总稀释后浓度对应原始
    // 实际取了1片, 稀释到V mL, 取液再稀释
    // 简化模型：取1片(标示量label mg)，溶解定容后稀释dilute倍
    // 标示量% = 实测含量/标示量×100 = (conc×V_total)/(label) ×100
    // 为避免歧义，采用清晰模型：
    var V_total=100; // 定容100mL
    var content=conc*V_total; // mg = 1片中实测含量
    ans=content/label*100;
    q.text="取本品20片，精密称定，平均片重 "+avgTab+" mg。研细后精密称取相当于1片的粉末，溶解后定容至100 mL，精密量取上清液10 mL，再稀释至 "+dilute+"00 mL（共稀释"+(100/10*dilute)+"倍）。在规定波长处测得吸光度 A = "+A.toFixed(2)+"，已知吸收系数 E1%1cm = "+E+"。计算该片剂标示量百分含量（%）。\n（标示量 "+label+" mg/片，L = 1 cm）";
    q.answer=Math.round(ans*100)/100;
    q.formula="C(mg/mL)=A/E×10="+A.toFixed(2)+"/"+E+"×10="+(A/E*10).toFixed(4)+"\n总稀释倍数="+(100/10*dilute)+"\n实测含量=C×总稀释×10mL... 化简:\n标示量% = (A×10×D×V_total)/(E×label)×100\n= ("+A.toFixed(2)+"×10×"+(100/10*dilute)+"×10)/("+E+"×"+label+")×100 ≈ "+q.answer+"%";
  }else if(type==="impurity"){
    // 难度升级：杂质限量 + 供试品稀释配制
    var L=(Math.floor(Math.random()*5)+1); // 限量 1-5 ppm → 0.0001-0.0005%
    var stdConc=(Math.floor(Math.random()*9)+1); // μg/mL
    var m=(Math.floor(Math.random()*20)+10)/10;  // g
    // L = C×V/m, V = L×m/C (L单位需统一)
    // L(ppm) = C(μg/mL)×V(mL)/m(g) × (1g/10^6μg) ×10^6 = C×V/m
    // 即 L(ppm) = C×V/m → V = L×m/C
    var V=L*m/stdConc; // mL
    q.text="某药物中重金属检查，规定杂质限量不得过 "+L+" ppm。现称取供试品 "+m+" g，依法检查。标准铅溶液浓度为 "+stdConc+" μg/mL（每1 mL相当于"+stdConc+" μg Pb）。\n问：应取标准铅溶液多少 mL 与供试品同法处理后比较？（保留2位小数）";
    q.answer=Math.round(V*100)/100;
    q.formula="L(ppm) = C×V/m → V = L×m/C\n= "+L+"×"+m+"/"+stdConc+" = "+q.answer+" mL";
  }else{
    // 难度升级：HPLC内标法 + 校正因子 + 多次稀释
    var f=(Math.floor(Math.random()*10)+10)/10; // 校正因子 1.0-1.9
    var As=(Math.floor(Math.random()*40)+60)/100; // 内标峰面积
    var Ai=(Math.floor(Math.random()*60)+80)/100; // 供试品峰面积
    var Cs=(Math.floor(Math.random()*5)+5);  // 内标浓度 mg/mL
    var dilute=(Math.floor(Math.random()*4)+5);  // 5-8 倍
    // Ci = (Ai/As)×Cs×f×稀释倍数
    var ans=Ai/As*Cs*f*dilute;
    q.text="HPLC内标法测定含量：精密称取内标物配制成 "+Cs+" mg/mL 的内标溶液。取供试品溶液（已稀释"+dilute+"倍）与内标溶液等体积混合进样。测得供试品峰面积 Ai = "+Ai.toFixed(2)+"，内标峰面积 As = "+As.toFixed(2)+"，已知相对校正因子 f = "+f.toFixed(1)+"。计算供试品原溶液浓度（mg/mL）。\n（提示：Ci = (Ai/As)×Cs×f×稀释倍数）";
    q.answer=Math.round(ans*1000)/1000;
    q.formula="Ci = (Ai/As)×Cs×f×D\n= ("+Ai.toFixed(2)+"/"+As.toFixed(2)+")×"+Cs+"×"+f.toFixed(1)+"×"+dilute+"\n= "+q.answer+" mg/mL";
  }
  return q;
}
function ad2(n){return (Math.round(n*100)/100).toFixed(2);}

function renderPhCalc(){
  phcalcState.count=0;phcalcState.right=0;phcalcState.start=Date.now();
  phcalcState.type="titration";
  phcalcState.q=genPhCalcQuestion("titration");
  $("main").innerHTML=
  '<div class="page active">'+
    '<div class="card"><div class="card-title"><span class="dot"></span>题型选择</div><div style="font-size:11px;color:var(--text-3);margin-bottom:8px;">题目含多步计算 · 校正因子/稀释倍数/单位换算</div><div class="calc-mode-tabs" id="phcTabs">'+
      '<div class="calc-mode-tab active" data-type="titration">滴定含量<br><span style="font-size:10px;opacity:.7;">含F校正</span></div>'+
      '<div class="calc-mode-tab" data-type="uv">紫外标示量<br><span style="font-size:10px;opacity:.7;">含稀释折算</span></div>'+
      '<div class="calc-mode-tab" data-type="impurity">杂质限量<br><span style="font-size:10px;opacity:.7;">求标准液体积</span></div>'+
      '<div class="calc-mode-tab" data-type="compare">HPLC内标法<br><span style="font-size:10px;opacity:.7;">含校正因子</span></div>'+
    '</div></div>'+
    '<div class="calc-card">'+
      '<div class="calc-question" id="phcQ" style="font-size:14px;line-height:1.8;white-space:pre-line;">'+phcalcState.q.text+'</div>'+
      '<input type="number" class="calc-input" id="phcInput" placeholder="输入答案（保留相应小数）" step="0.0001">'+
      '<button class="calc-submit" id="phcSubmit">提交答案</button>'+
      '<div class="calc-feedback" id="phcFb"></div>'+
      '<div id="phcFormula" style="font-size:12px;color:var(--text-2);margin-top:8px;display:none;background:var(--m-mint-l);padding:10px;border-radius:8px;font-family:Georgia,serif;"></div>'+
    '</div>'+
    '<div class="calc-stats-bar">'+
      '<div class="calc-stat"><div class="cs-num" id="phcRight">0</div><div class="cs-lbl">正确</div></div>'+
      '<div class="calc-stat"><div class="cs-num" id="phcTotal">0</div><div class="cs-lbl">总数</div></div>'+
      '<div class="calc-stat"><div class="cs-num" id="phcRate">0%</div><div class="cs-lbl">正确率</div></div>'+
    '</div>'+
  '</div>';

  function refresh(){
    phcalcState.q=genPhCalcQuestion(phcalcState.type);
    $("phcQ").innerHTML=phcalcState.q.text;
    $("phcInput").value="";
    $("phcInput").className="calc-input";
    $("phcFb").textContent="";
    $("phcFb").className="calc-feedback";
    $("phcFormula").style.display="none";
  }
  function updateStats(){
    $("phcRight").textContent=phcalcState.right;
    $("phcTotal").textContent=phcalcState.count;
    $("phcRate").textContent=phcalcState.count===0?"0%":Math.round(phcalcState.right/phcalcState.count*100)+"%";
  }
  function submit(){
    var input=$("phcInput"),fb=$("phcFb"),f=$("phcFormula");
    var val=parseFloat(input.value);
    if(isNaN(val))return;
    phcalcState.count++;
    var ans=phcalcState.q.answer;
    var ok=Math.abs(val-ans)<Math.abs(ans)*0.02||Math.abs(val-ans)<0.01;
    if(ok){
      phcalcState.right++;
      input.className="calc-input correct";
      fb.textContent="✓ 正确！答案 "+ans;
      fb.className="calc-feedback right";
    }else{
      input.className="calc-input wrong";
      fb.textContent="✗ 正确答案 "+ans;
      fb.className="calc-feedback wrong";
    }
    f.textContent="推导："+phcalcState.q.formula;
    f.style.display="block";
    updateStats();
    setTimeout(refresh,2500);
  }
  $("phcSubmit").addEventListener("click",submit);
  $("phcInput").addEventListener("keypress",function(e){if(e.key==="Enter")submit();});
  var tabs=document.querySelectorAll("#phcTabs .calc-mode-tab");
  for(var i=0;i<tabs.length;i++)tabs[i].addEventListener("click",function(){
    var ts=document.querySelectorAll("#phcTabs .calc-mode-tab");
    for(var j=0;j<ts.length;j++)ts[j].classList.remove("active");
    this.classList.add("active");
    phcalcState.type=this.dataset.type;
    phcalcState.count=0;phcalcState.right=0;phcalcState.start=Date.now();
    refresh();updateStats();
  });
}

    {name:"新斯的明",en:"neostigmine",class:"抗胆碱酯酶药",struct:"母核：二甲氨基苯酚酯。含：3-二甲氨基苯酚+甲氨基甲酸酯，N上甲基（季铵盐）。",features:"氨基甲酸酯→可逆抑制胆碱酯酶；季铵盐→不透过血脑屏障（外周作用）；二甲氨基→必需。",use:"重症肌无力、术后肠麻痹、非去极化肌松药拮抗。",tip:"新斯的明=季铵盐（不进脑）+氨基甲酸酯（可逆抑制）。毒扁豆碱是叔胺（可进脑）。"},
    {name:"肾上腺素",en:"epinephrine",class:"拟肾上腺素药",struct:"母核：β-苯乙胺骨架。3,4位邻苯二酚（儿茶酚）、β位羟基、N-甲基取代。",features:"3,4-OH（儿茶酚）→直接激动受体，易代谢失活；N-甲基→α、β均激动。",use:"心脏骤停、过敏性休克、支气管哮喘急性发作、局部止血。",tip:"儿茶酚胺=3,4位双OH。'3,4定生死'：去甲肾(N-H)→肾上腺素(N-CH₃)→异丙肾(N-异丙基)，β效应递增。"},
    {name:"去甲肾上腺素",en:"norepinephrine",class:"拟肾上腺素药",struct:"母核：β-苯乙胺骨架。3,4位儿茶酚、β位羟基、N上无取代（伯胺）。",features:"N-H（伯胺）→以α受体激动为主；儿茶酚→直接作用但易失活。",use:"休克、低血压（外周血管收缩）。",tip:"去甲肾vs肾上腺素：N上无甲基→以α效应为主（缩血管升压）。"},
    {name:"异丙肾上腺素",en:"isoproterenol",class:"拟肾上腺素药",struct:"母核：β-苯乙胺骨架。3,4位儿茶酚、β位羟基、N-异丙基取代。",features:"N-异丙基→β受体选择性激动（β₁+β₂）；几乎无α效应。",use:"支气管哮喘、心脏骤停、房室传导阻滞。",tip:"异丙肾=N-异丙基→纯β激动。'异丙→β'。用于哮喘（β₂）和心脏（β₁）。"},
    {name:"麻黄碱",en:"ephedrine",class:"拟肾上腺素药",struct:"母核：苯乙胺骨架。苯环无羟基（非儿茶酚）、β位羟基、N-甲基。含两个手性碳。",features:"非儿茶酚→不被COMT代谢，作用持久；可口服；混合作用（直接+间接促释放）。",use:"鼻塞（减充血）、低血压、哮喘预防。",tip:"麻黄碱=无儿茶酚+β-OH+N-CH₃。非儿茶酚→可口服、持久。中药麻黄来源。"},
    {name:"普萘洛尔",en:"propranolol",class:"抗肾上腺素药·β受体阻断剂",struct:"母核：芳氧丙醇胺骨架（-O-CH₂-CH(OH)-CH₂-NH-R）。芳环为萘环，N-异丙基。",features:"芳氧丙醇胺比苯乙醇胺活性强；β位(R)构型→活性强；N-异丙基→非选择性β阻断。",use:"高血压、心绞痛、心律失常、甲亢辅助。",tip:"β阻断剂核心骨架=芳氧丙醇胺。N取代基决定选择性：异丙基/叔丁基→非选择，4-甲氧乙基→β₁选择（美托洛尔）。"},
    {name:"美托洛尔",en:"metoprolol",class:"抗肾上腺素药·β₁受体阻断剂",struct:"母核：芳氧丙醇胺。芳环为4-甲氧乙基苯基，N-异丙基。",features:"4位甲氧乙基→β₁受体选择性；对β₂影响小→不影响支气管。",use:"高血压、心绞痛、心力衰竭、心律失常。",tip:"美托洛尔=芳氧丙醇胺+4-甲氧乙基→β₁选择。哮喘患者相对安全。'洛尔'后缀。"},
    {name:"雷尼替丁",en:"ranitidine",class:"抗组胺药·H₂受体阻断剂",struct:"母核：呋喃环。含：呋喃环+含硫侧链（硫醚）+硝基胍基（不是咪唑）。",features:"呋喃环（非咪唑）→H₂选择性；硝基胍→活性基团；含硫侧链。",use:"胃溃疡、十二指肠溃疡、反流性食管炎。",tip:"雷尼替丁vs西咪替丁：呋喃环替代咪唑环→H₂选择性更高，抗雄激素副作用减少。'替丁'后缀。"},
    {name:"氯苯那敏",en:"chlorpheniramine",class:"抗组胺药·H₁受体阻断剂",struct:"母核：丙胺类。含：对氯苄基+吡啶环+二甲氨基（叔胺）。",features:"对氯苄基+吡啶→H₁受体阻断；叔胺→可透过血脑屏障（有嗜睡）。",use:"过敏性鼻炎、荨麻疹、皮肤过敏。",tip:"氯苯那敏=对氯苄基+吡啶+二甲氨基。经典H₁阻断剂（第一代），有中枢镇静。'那敏/苯那敏'。"}
  ]},
  {cat:"心血管系统药物",items:[
    {name:"硝苯地平",en:"nifedipine",class:"钙通道阻滞剂·二氢吡啶类",struct:"母核：1,4-二氢吡啶环。3,5位双甲酸酯、4位邻硝基苯基、2,6位双甲基。",features:"4位邻硝基苯基→活性必需；3,5位双酯→必需；二氢吡啶不可氧化。",use:"高血压、心绞痛（变异型首选）。",tip:"DHP核心：1,4-二氢吡啶+4位邻硝基苯基+3,5位双酯。'地平'后缀。氨氯地平2位换氨基乙氧甲基→长效。"},
    {name:"氨氯地平",en:"amlodipine",class:"钙通道阻滞剂·二氢吡啶类",struct:"母核：1,4-二氢吡啶环。2位氨基乙氧甲基（特征取代）、3位乙氧羰基、5位甲酸甲酯、4位邻氯苯基。",features:"2位氨基乙氧甲基→增加亲水性/组织亲和力→长效；4位邻氯苯基（非硝基）。",use:"高血压、稳定型心绞痛。",tip:"氨氯地平=硝苯地平改良：2位加氨基乙氧甲基→长效（一天一次）。'地平'类长效代表。"},
    {name:"卡托普利",en:"captopril",class:"ACE抑制剂",struct:"母核：脯氨酸衍生物。含巯基（-SH）的酰基氨基酸，巯基与酶Zn²⁺结合。",features:"巯基→与ACE活性中心Zn²⁺配位结合；但易引起皮疹/味觉障碍；L-脯氨酸必需。",use:"高血压、心力衰竭、糖尿病肾病保护。",tip:"ACE抑制剂药效团：巯基（与Zn结合）。卡托普利含巯基→短效+副作用多。'-普利'后缀。"},
    {name:"依那普利",en:"enalapril",class:"ACE抑制剂（前药）",struct:"母核：脯氨酸衍生物。不含巯基，含羧基（与Zn结合）；为乙酯前药（体内水解为依那普利拉）。",features:"羧基替代巯基→副作用减少；乙酯前药→口服吸收好，体内水解为活性形式（依那普利拉）；长效。",use:"高血压、心力衰竭。",tip:"依那普利=前药（乙酯）→体内水解为依那普利拉（活性）。不含巯基→长效+副作用少。"},
    {name:"氯沙坦",en:"losartan",class:"血管紧张素Ⅱ受体阻断剂(ARB)",struct:"母核：联苯四唑。含：2-丁基-4-氯-1-[[2'-(1H-四唑-5-基)联苯-4-基]甲基]咪唑-5-甲醇。",features:"联苯四唑→AT₁受体阻断；咪唑环→活性核心；四唑基→增强亲和力/酸性。",use:"高血压、心力衰竭、糖尿病肾病（不引起干咳）。",tip:"ARB='沙坦'类。联苯四唑+咪唑是核心。与ACE抑制剂不同：不抑制缓激肽降解→无干咳副作用。"},
    {name:"洛伐他汀",en:"lovastatin",class:"调血脂药·HMG-CoA还原酶抑制剂",struct:"母核：六氢萘稠合六元δ-内酯环。含2-甲基丁酰侧链。",features:"内酯环为前药→体内水解为开环β-羟基酸（活性形式）；六氢萘→疏水结合。",use:"高胆固醇血症、动脉粥样硬化预防。",tip:"他汀类核心：内酯（前药）→开环酸（活性）。'六氢萘+内酯'=洛伐他汀。辛伐他汀侧链多一甲基→更强。"},
    {name:"辛伐他汀",en:"simvastatin",class:"调血脂药·HMG-CoA还原酶抑制剂",struct:"母核：六氢萘稠合六元内酯环。与洛伐他汀区别：2-甲基丁酰侧链多一个甲基（2,2-二甲基丁酸酯）。",features:"侧链多一个甲基→亲脂性增强→活性增强；仍为前药（内酯→开环酸）。",use:"高胆固醇血症、冠心病预防。",tip:"辛伐他汀=洛伐他汀+侧链多一甲基→更强。半合成他汀。'他汀'后缀。"},
    {name:"氟伐他汀",en:"fluvastatin",class:"调血脂药·HMG-CoA还原酶抑制剂",struct:"母核：吲哚环（非六氢萘）。含：3,5-二羟基庚酸侧链（开环活性形式，非前药）。",features:"吲哚替代六氢萘→全合成；开环酸形式→直接活性（非前药）；氟苯基取代。",use:"高胆固醇血症。",tip:"氟伐他汀=全合成他汀：吲哚环+开环酸（非前药）。与洛伐他汀（天然/半合成前药）区别。"},
    {name:"普鲁卡因胺",en:"procainamide",class:"抗心律失常药·Ⅰa类",struct:"母核：对氨基苯甲酰胺。含：对氨基苯甲酸+二乙氨基乙胺（酰胺键连接）。",features:"对位氨基→必需；酰胺键（非酯键，区别于普鲁卡因）；二乙氨基。",use:"室性心律失常（室早、室速）。",tip:"普鲁卡因胺vs普鲁卡因：酰胺键替代酯键→不易被酯酶水解，作用持久。Ⅰa类钠通道阻滞剂。"},
    {name:"胺碘酮",en:"amiodarone",class:"抗心律失常药·Ⅲ类",struct:"母核：苯并呋喃环。含：2-丁基-3-(3,5-二碘-4-羟基苯甲酰基)苯并呋喃，侧链含二乙氨基乙基。",features:"苯并呋喃+两个碘原子→钾通道阻滞（延长复极）；含碘→影响甲状腺功能。",use:"室性/室上性心律失常（广谱）。",tip:"胺碘酮=苯并呋喃+双碘。Ⅲ类（钾通道阻滞）。含碘→甲状腺功能异常副作用。广谱抗心律失常。"},
    {name:"硝酸甘油",en:"nitroglycerin",class:"抗心绞痛药·硝酸酯类",struct:"母核：甘油三硝酸酯。1,2,3-丙三醇三硝酸酯（三个-ONO₂基团）。",features:"硝酸酯基（-ONO₂）→体内释放NO→血管平滑肌松弛；含3个酯基。",use:"心绞痛急性发作（舌下含服）、心力衰竭。",tip:"硝酸甘油=丙三醇+3个硝酸酯基。释放NO→扩血管（静脉>动脉）→降低心肌耗氧。舌下含服起效快。"},
    {name:"地高辛",en:"digoxin",class:"强心药·强心苷类",struct:"母核：甾体母核+不饱和内酯环（α,β-不饱和γ-内酯）+糖基（三分子洋地黄毒糖）。C14位β-OH，C17位不饱和内酯。",features:"C17位不饱和内酯环→强心活性必需；甾体C/D顺式稠合；糖基增强水溶性。",use:"心力衰竭、心房颤动/心房扑动（控制心室率）。",tip:"强心苷核心：甾体+C17不饱和内酯+糖基。C14-β-OH是活性必需。中毒剂量与治疗剂量接近→需监测血药浓度。"}
  ]},
  {cat:"抗菌药物",items:[
    {name:"青霉素G",en:"benzylpenicillin",class:"β-内酰胺类·青霉素",struct:"母核：青霉烷（β-内酰胺环稠合五元噻唑烷环）。6-APA母核，侧链为苄基。",features:"β-内酰胺环→活性必需，开环失活；6位侧链可改造；不耐酸、不耐酶、过敏。",use:"革兰阳性菌感染、梅毒、链球菌感染。",tip:"青霉素核心：β-内酰胺+噻唑烷。6-APA是母核。三大问题：不耐酸/不耐酶/过敏。侧链改造→半合成青霉素。"},
    {name:"氨苄西林",en:"ampicillin",class:"β-内酰胺类·半合成青霉素",struct:"母核：6-APA。侧链为D-苯甘氨酸（含氨基）。侧链引入NH₂→耐酸。",features:"侧链氨基（α-氨基）→耐酸（可口服）；广谱（G⁺和G⁻）；但仍不耐酶。",use:"呼吸道/泌尿道/肠道感染（广谱）。",tip:"氨苄西林=6-APA+苯甘氨酸侧链（含NH₂）→耐酸+广谱。阿莫西林=对羟基氨苄西林→口服吸收更好。"},
    {name:"阿莫西林",en:"amoxicillin",class:"β-内酰胺类·半合成青霉素",struct:"母核：6-APA。侧链为对羟基苯甘氨酸（比氨苄西林多对位羟基）。",features:"对位羟基→口服吸收更好；广谱（同氨苄西林）；不耐酶。",use:"呼吸道/泌尿道/消化道感染（幽门螺杆菌根除）。",tip:"阿莫西林=氨苄西林+对位羟基→口服吸收更好。常与克拉维酸合用→耐酶（奥格门汀）。"},
    {name:"头孢氨苄",en:"cephalexin",class:"β-内酰胺类·头孢菌素（第一代）",struct:"母核：头孢烯（β-内酰胺环稠合六元双氢噻嗪环）。7-ACA母核，3位甲基、7位苯甘氨酸侧链。",features:"六元双氢噻嗪环比五元噻唑烷更稳定→耐酸；7位侧链决定抗菌谱。",use:"革兰阳性/阴性菌感染（呼吸道、泌尿道、皮肤）。",tip:"头孢菌素核心：β-内酰胺+双氢噻嗪（六元环）→比青霉素稳定。7-ACA是母核。'头孢'前缀。"},
    {name:"头孢曲松",en:"ceftriaxone",class:"β-内酰胺类·头孢菌素（第三代）",struct:"母核：7-ACA。3位三嗪二酮侧链、7位氨基噻唑肟基侧链。",features:"7位氨基噻唑+甲氧肟基→对β-内酰胺酶稳定+G⁻活性强；3位三嗪二酮→长效。",use:"严重感染（脑膜炎、败血症）、淋病。",tip:"第三代头孢特征：7位氨基噻唑肟基→抗β-内酰胺酶+G⁻增强。头孢曲松3位三嗪二酮→半衰期长（一天一次）。"},
    {name:"环丙沙星",en:"ciprofloxacin",class:"喹诺酮类抗菌药",struct:"母核：4-喹诺酮（1,4-二氢-4-氧代喹啉-3-羧酸）。6位氟、7位哌嗪基、1位环丙基。",features:"6位F→增强DNA促旋酶亲和力+细胞穿透；7位哌嗪→扩大抗菌谱（G⁻）；1位环丙基→增强活性。",use:"泌尿生殖道、呼吸道、肠道、皮肤软组织感染（G⁻为主）。",tip:"氟喹诺酮核心：4-喹诺酮+6位F+7位哌嗪。3位羧基4位酮基=活性必需。1位环丙基→最强。'沙星'后缀。儿童孕妇慎用。"},
    {name:"左氧氟沙星",en:"levofloxacin",class:"喹诺酮类抗菌药",struct:"母核：喹诺酮母核并入噁嗪环（三环）。含6位氟、7位哌嗪、8位氧（噁嗪环）。左旋光学异构体。",features:"噁嗪环并入→增强对G⁺活性+减少光毒性；左旋体活性强（消旋体的氧氟沙星的两倍）。",use:"呼吸道感染（社区获得性肺炎）、泌尿道感染。",tip:"左氧氟沙星=氧氟沙星的左旋体（活性强一倍）。含噁嗪环→增强G⁺活性。呼吸喹诺酮代表。"},
    {name:"磺胺甲噁唑",en:"sulfamethoxazole",class:"磺胺类抗菌药",struct:"母核：对氨基苯磺酰胺。N1位异噁唑环取代。对位游离氨基。",features:"对位游离氨基→必需（PABA类似物）；N1杂环取代→增强活性；竞争抑制二氢叶酸合成酶。",use:"泌尿道、呼吸道感染（常与TMP合用→协同增效）。",tip:"磺胺核心：对氨基苯磺酰胺。PABA类似物→抑制二氢叶酸合成酶。对位-NH₂必需。与TMP合用→双重阻断叶酸代谢。"},
    {name:"异烟肼",en:"isoniazid",class:"抗结核药",struct:"母核：吡啶-4-甲酰肼（异烟酸肼）。吡啶环4位连接酰肼基（-CONHNH₂）。",features:"吡啶环+酰肼基→抗结核活性；肼基→与分枝菌酸合成酶结合（抑制细胞壁合成）。",use:"各型结核病（一线用药）。",tip:"异烟肼=异烟酸+酰肼。抗结核一线。抑制分枝菌酸合成→破坏结核杆菌细胞壁。肝毒性需监测。"},
    {name:"利福平",en:"rifampin",class:"抗结核药",struct:"母核：利福霉素SV的大环内酰胺衍生物。含萘酚环+大环内酰胺桥+哌嗪亚胺甲基侧链。",features:"大环内酰胺结构→抑制DNA依赖性RNA聚合酶；哌嗪侧链→增强口服吸收；广谱（结核+麻风+G⁺）。",use:"结核病（一线）、麻风、耐药金葡菌感染。",tip:"利福平=利福霉素SV半合成衍生物。抑制RNA聚合酶→阻断转录。橙红色药物（尿液/泪液变红）。"},
    {name:"甲氧苄啶",en:"trimethoprim",class:"二氢叶酸还原酶抑制剂",struct:"母核：2,4-二氨基-5-(3,4,5-三甲氧基苄基)嘧啶。嘧啶环2,4位双氨基。",features:"2,4-二氨基嘧啶→抑制二氢叶酸还原酶（DHFR）；三甲氧基苄基→增强活性；与磺胺合用→双重阻断。",use:"泌尿道/呼吸道感染（常与SMZ合用=复方新诺明）。",tip:"TMP=二氨基嘧啶+三甲氧基苄基。抑制DHFR→阻断四氢叶酸合成。与磺胺（抑制二氢叶酸合成酶）合用→双重阻断→协同增效。"},
    {name:"两性霉素B",en:"amphotericin B",class:"抗真菌药·多烯大环类",struct:"母核：大环内酯（37元环）。含7个共轭双键（七烯）+氨基糖（去氧氨基糖）+羧基。两性（氨基+羧基）。",features:"七烯大环→与真菌细胞膜麦角甾醇结合→形成孔道→漏出死亡；对哺乳动物胆固醇亲和力低（选择性）。",use:"深部真菌感染（隐球菌脑膜炎、念珠菌病）。",tip:"两性霉素B=大环+7个共轭双键（七烯）。与麦角甾醇结合→膜穿孔。广谱抗深部真菌。肾毒性大→需监测。"},
    {name:"氟康唑",en:"fluconazole",class:"抗真菌药·唑类",struct:"母核：1,2,4-三唑。含：双三唑+2,4-二氟苯基-1,3-二醇丙烷骨架（两个三唑通过丙二醇连接）。",features:"三唑环→抑制细胞色素P450（羊毛甾醇14α-脱甲基酶）→阻断麦角甾醇合成；双氟苯基→增强活性；水溶性好可透过血脑屏障。",use:"念珠菌/隐球菌感染（含脑膜炎）。",tip:"唑类抗真菌=抑制麦角甾醇合成（P450 14α-脱甲基酶）。氟康唑=双三唑+双氟苯。可透过血脑屏障→治隐球菌脑膜炎。'康唑'后缀。"},
    {name:"阿昔洛韦",en:"acyclovir",class:"抗病毒药·核苷类似物",struct:"母核：鸟嘌呤核苷类似物。9-[(2-羟基乙氧基)甲基]鸟嘌呤（无环糖替代物）。",features:"鸟嘌呤+无环侧链→在病毒感染的细胞中被病毒胸苷激酶磷酸化为三磷酸形式→掺入DNA链终止延伸；对未感染细胞毒性低（选择性）。",use:"单纯疱疹病毒(HSV)、水痘-带状疱疹病毒(VZV)感染。",tip:"阿昔洛韦=鸟嘌呤+无环侧链。前药（需病毒TK磷酸化激活）→选择性高。'洛韦'后缀=核苷类抗病毒。"},
    {name:"利巴韦林",en:"ribavirin",class:"抗病毒药·核苷类似物",struct:"母核：1-β-D-呋喃核糖基-1H-1,2,4-三氮唑-3-甲酰胺。嘌呤/嘧啶的类似物（三氮唑碱基+核糖）。",features:"三氮唑核苷→抑制IMP脱氢酶+RNA聚合酶；广谱抗病毒。",use:"呼吸道合胞病毒(RSV)、丙肝（与干扰素合用）、流行性出血热。",tip:"利巴韦林=三氮唑核苷。广谱抗病毒（RNA+DNA病毒）。'韦林'后缀。孕妇禁用（致畸）。"}
  ]},
  {cat:"抗肿瘤药物",items:[
    {name:"环磷酰胺",en:"cyclophosphamide",class:"烷化剂·氮芥类",struct:"母核：氮芥（双β-氯乙基氨基）。N上连接含磷酰胺基的环状侧链（前药设计）。",features:"氮芥基团→体内活化生成乙撑亚胺离子→DNA交联；磷酰胺环→前药（肿瘤磷酰胺酶活化→选择性）。",use:"淋巴瘤、白血病、乳腺癌、卵巢癌（广谱）。",tip:"氮芥核心：N(CH₂CH₂Cl)₂。环磷酰胺=前药典范：磷酰胺基作'运输基团'，肿瘤细胞选择性活化→减毒。"},
    {name:"氟尿嘧啶",en:"fluorouracil",class:"抗代谢药·嘧啶拮抗剂",struct:"母核：尿嘧啶。5位H被F取代（5-FU）。F-C键牢固。",features:"5位F→与尿嘧啶结构相似（生物电子等排体）；抑制dTMP合成酶+掺入RNA；伪代谢物。",use:"消化道肿瘤、乳腺癌、头颈部肿瘤（广谱）。",tip:"5-FU=尿嘧啶5位F。①抑制dTMP合成酶→阻断DNA合成；②F掺入RNA→干扰RNA功能。'尿嘧啶5位F'关键记忆。"},
    {name:"巯嘌呤",en:"mercaptopurine",class:"抗代谢药·嘌呤拮抗剂",struct:"母核：嘌呤。6位羟基被巯基（-SH）取代（6-巯基嘌呤，6-MP）。",features:"6位-SH→与次黄嘌呤结构相似；体内被HGPRT磷酸化为核苷酸→抑制嘌呤合成；掺入DNA/RNA。",use:"急性白血病（儿童急淋维持治疗）。",tip:"6-MP=嘌呤6位-OH→-SH。次黄嘌呤类似物→抑制嘌呤合成。黄嘌呤氧化酶代谢→与别嘌醇合用需减量。"},
    {name:"甲氨蝶呤",en:"methotrexate",class:"抗代谢药·叶酸拮抗剂",struct:"母核：叶酸类似物。含：蝶啶环+对氨基苯甲酸+谷氨酸。4位OH被NH₂取代（氨基蝶呤衍生物）。",features:"4位氨基→与二氢叶酸还原酶(DHFR)亲和力比叶酸强1000倍；抑制四氢叶酸合成→阻断dTMP合成→阻断DNA合成。",use:"急性白血病、绒毛膜上皮癌、银屑病、类风湿性关节炎。",tip:"MTX=叶酸4位OH→NH₂。抑制DHFR→阻断四氢叶酸→阻断dTMP合成。救援剂：甲酰四氢叶酸（亚叶酸钙）挽救正常细胞。"},
    {name:"顺铂",en:"cisplatin",class:"金属配合物·铂类",struct:"中心Pt²⁺ + 2个Cl⁻（离去基团）+ 2个NH₃（载体基团），顺式平面四边形。",features:"顺式构型→活性必需（反式无活性）；Cl⁻在低Cl⁻环境（细胞内）水取代→活化；与DNA鸟嘌呤N7位交联。",use:"睾丸癌、卵巢癌、膀胱癌、肺癌。",tip:"顺铂=顺式-[Pt(NH₃)₂Cl₂]。'顺式有效、反式无效'。2个NH₃=载体（识别DNA），2个Cl=离去基团（体内活化）。"},
    {name:"卡铂",en:"carboplatin",class:"金属配合物·铂类（第二代）",struct:"母核：顺铂。2个Cl被1,1-环丁烷二羧酸（CBDCA）替代，仍为顺式构型。",features:"CBDCA替代Cl→稳定性增强、肾毒性/消化道反应降低；水溶性更好；骨髓抑制为主。",use:"卵巢癌、小细胞肺癌、头颈部肿瘤。",tip:"卡铂=顺铂+CBDCA替代Cl→第二代。减毒（肾毒性↓）但骨髓抑制↑。'铂'后缀。"},
    {name:"紫杉醇",en:"paclitaxel",class:"抗肿瘤植物药·紫杉烷类",struct:"母核：紫杉烷三环二萜。含：四元氧杂环+酯侧链（N-苯甲酰-苯基异丝氨酸）、C13位酯侧链。",features:"紫杉烷骨架→促进微管蛋白聚合+稳定微管→阻止解聚→阻断有丝分裂；C13侧链→活性必需。",use:"卵巢癌、乳腺癌、非小细胞肺癌。",tip:"紫杉醇=紫杉烷二萜+C13酯侧链。作用独特：促进微管聚合（而非抑制）+稳定微管→阻断有丝分裂。天然来源（红豆杉树皮）。"},
    {name:"多柔比星",en:"doxorubicin",class:"抗肿瘤抗生素·蒽环类",struct:"母核：蒽环（四环结构：A/B/C/D环）。含：蒽醌发色团+氨基糖（柔红糖胺）+侧链。C7位羟基、C9位侧链。",features:"蒽环平面结构→嵌入DNA碱基对间；氨基糖→增强DNA结合；抑制拓扑异构酶Ⅱ→DNA断裂；产生自由基。",use:"广谱：乳腺癌、白血病、淋巴瘤、肉瘤。",tip:"多柔比星(阿霉素)=蒽环+氨基糖。三重机制：①DNA嵌入 ②抑制TopoⅡ ③自由基。剂量限制性毒性：心脏毒性（蓄积）。"},
    {name:"羟基脲",en:"hydroxyurea",class:"抗代谢药·核苷酸还原酶抑制剂",struct:"母核：尿素。一个氨基被羟基取代（N-羟基脲，HO-NH-CO-NH₂）。",features:"羟基→抑制核糖核苷酸还原酶→阻断DNA合成（S期特异性）；结构简单。",use:"慢性粒细胞白血病、真性红细胞增多症、镰状细胞贫血。",tip:"羟基脲=尿素+羟基取代。抑制核糖核苷酸还原酶→阻断DNA合成。S期特异性。结构最简单的抗代谢药之一。"},
    {name:"他莫昔芬",en:"tamoxifen",class:"激素类抗肿瘤药·抗雌激素",struct:"母核：三苯乙烯骨架。含：1,2-二苯基-1-[4-(2-二甲氨基乙氧基)苯基]-1-丁烯（三苯乙烯+二甲氨基乙氧基侧链）。",features:"三苯乙烯骨架→雌激素受体拮抗剂（竞争性）；反式异构体活性强；C端侧链→必需。",use:"雌激素受体阳性(ER+)乳腺癌（内分泌治疗）。",tip:"他莫昔芬=三苯乙烯骨架。ER拮抗剂→用于ER+乳腺癌。前药（体内代谢为4-羟基他莫昔芬，活性强100倍）。'昔芬'后缀=抗雌激素。"}
  ]},
  {cat:"解热镇痛及非甾体抗炎药",items:[
    {name:"阿司匹林",en:"aspirin",class:"解热镇痛药·水杨酸类",struct:"母核：水杨酸。羧基的邻位羟基被乙酰化（乙酰水杨酸）。",features:"乙酰化水杨酸→不可逆抑制COX（乙酰化Ser530）；解热镇痛+抗炎+抗血小板（小剂量）。",use:"解热镇痛、抗炎、抗血小板（心血管疾病预防）。",tip:"阿司匹林=水杨酸乙酰化。不可逆抑制COX→小剂量抗血小板（心血管预防）、大剂量抗炎。胃肠道刺激常见。"},
    {name:"对乙酰氨基酚",en:"acetaminophen",class:"解热镇痛药·苯胺类",struct:"母核：对氨基苯酚。氨基被乙酰化（N-乙酰对氨基苯酚，扑热息痛）。",features:"对位羟基+乙酰氨基→解热镇痛（中枢COX抑制）；几乎无外周抗炎作用（不抑制外周COX）。",use:"发热、轻中度疼痛（头痛、关节痛）。",tip:"对乙酰氨基酚=对氨基苯酚乙酰化。解热镇痛但无抗炎（中枢COX为主）。过量→肝毒性（谷胱甘肽耗竭）。'扑热息痛'=paracetamol。"},
    {name:"布洛芬",en:"ibuprofen",class:"非甾体抗炎药·丙酸类",struct:"母核：2-(4-异丁苯基)丙酸。苯环对位异丁基+α位甲基+羧基。",features:"对位异丁基+丙酸→抑制COX（可逆）；S(+)异构体活性强；解热镇痛抗炎。",use:"类风湿性关节炎、骨关节炎、发热、疼痛。",tip:"布洛芬=苯丙酸类。'布洛芬'='异丁苯丙酸'。COX非选择性抑制剂（COX-1/COX-2）。'芬'后缀=丙酸类NSAID。"},
    {name:"吲哚美辛",en:"indomethacin",class:"非甾体抗炎药·吲哚乙酸类",struct:"母核：吲哚环。5位甲氧基、2位甲基、3位乙酸侧链、N-对氯苯甲酰基。",features:"吲哚乙酸骨架→抑制COX（强效）；5位甲氧基+N-对氯苯甲酰基→增强活性。",use:"类风湿性关节炎、强直性脊柱炎、急性痛风。",tip:"吲哚美辛=吲哚乙酸+对氯苯甲酰基。强效NSAID但副作用大（消化道/中枢）。'美辛'后缀。"},
    {name:"双氯芬酸",en:"diclofenac",class:"非甾体抗炎药·苯乙酸类",struct:"母核：2-(2,6-二氯苯氨基)苯乙酸。邻位双氯苯基+氨基+乙酸侧链。",features:"2,6位双氯→增强COX抑制（尤其COX-2）；氨基连接苯环与乙酸；强效抗炎镇痛。",use:"类风湿性关节炎、骨关节炎、术后疼痛、痛经。",tip:"双氯芬酸=邻氨基苯乙酸+2,6-双氯。COX-2选择性较高。'芬酸'后缀=苯乙酸类NSAID。常用钠盐。"}
  ]},
  {cat:"维生素及激素类药物",items:[
    {name:"维生素C",en:"ascorbic acid",class:"维生素·水溶性",struct:"母核：L-古洛糖酸的内酯（γ-内酯）。含：呋喃型内酯环+2,3位双键烯二醇（烯醇结构）。",features:"2,3位烯二醇→强还原性（抗氧化）；L-构型（天然）；内酯环。",use:"坏血病防治、抗氧化辅助、增强免疫。",tip:"VC=L-古洛糖酸内酯+2,3位烯二醇。烯二醇结构→强还原性→抗氧化。人体不能合成→必须从食物摄取。"},
    {name:"维生素A",en:"retinol",class:"维生素·脂溶性",struct:"母核：全反式视黄醇。含：β-紫罗兰酮环（环己烯）+侧链（四个异戊二烯单位）+末端伯醇。",features:"全反式构型→活性形式；β-紫罗兰酮环+共轭多烯链→转化为视黄醛→参与视觉循环（视紫红质辅基）。",use:"夜盲症、干眼症、皮肤角化。",tip:"VA=β-紫罗兰酮环+多烯侧链+醇。体内氧化为视黄醛→参与视紫红质（暗视觉）。全反式活性最强。"},
    {name:"氢化可的松",en:"hydrocortisone",class:"糖皮质激素",struct:"母核：甾体（孕甾烷骨架，C21）。含：4-烯-3-酮（α,β-不饱和酮）、11β-OH、17α-OH、21位羟基+20位酮基（二羟丙酮侧链）。",features:"11β-OH+17α-OH→糖皮质激素活性（抗炎/免疫抑制）；4-烯-3-酮+20-酮-21-羟基→活性必需。",use:"抗炎、免疫抑制、抗过敏、肾上腺皮质功能减退替代治疗。",tip:"糖皮质激素核心：甾体+11β-OH+17α-OH+4-烯-3-酮+二羟丙酮侧链。'可的松'=11位酮基（体内转化为11β-OH才活性）。"},
    {name:"地塞米松",en:"dexamethasone",class:"糖皮质激素（合成）",struct:"母核：氢化可的松骨架。区别：9α-氟、16α-甲基、1,2位脱氢（双键）。",features:"9α-F→增强抗炎活性；16α-甲基→消除盐皮质激素作用（纯糖皮质激素）；1,2位双键→增强活性。",use:"抗炎（强效）、免疫抑制、抗休克、预防早产儿呼吸窘迫综合征。",tip:"地塞米松=氢化可的松+9α-F+16α-甲基+1,2位脱氢→强效+无盐皮质激素作用。'米松'后缀=含16α-甲基。"},

    {name:"睾酮",en:"testosterone",class:"雄激素",struct:"母核：雄甾烷（C19甾体）。含：4-烯-3-酮（α,β-不饱和酮）、17β-OH；C19角甲基。",features:"4-烯-3-酮+17β-OH→雄激素活性；17β-OH构型→活性最强；C19角甲基。",use:"男性性功能减退替代治疗、再生障碍性贫血。",tip:"睾酮=C19甾体+4-烯-3-酮+17β-OH。'4-烯-3-酮'=雄激素活性必需基团。17位酯化→前药（丙酸睾酮，长效）。"},

function renderStructCard(){
  var catActive=0;
  $("main").innerHTML=
  '<div class="page active">'+
    '<div class="card"><div class="card-title"><span class="dot"></span>药化结构式卡片</div><div style="font-size:12px;color:var(--text-2);line-height:1.6;margin-bottom:10px;">按浙大349考纲完整整理 · 7大类50+药物<br>结构式来自PubChem数据库 · 点击卡片翻转查看构效关系/用途/记忆要点</div></div>'+
    '<div class="file-tabs" id="structTabs">'+
      STRUCT_CARDS.map(function(c,i){return '<div class="file-tab'+(i===0?" active":"")+'" data-cat="'+i+'">'+c.cat+' '+c.items.length+'</div>';}).join("")+
    '</div>'+
    '<div id="structList"></div>'+
  '</div>';
  function renderList(){
    var list=$("structList");
    var cat=STRUCT_CARDS[catActive];
    list.innerHTML=cat.items.map(function(it,i){
      var imgUrl=PUBCHEM_IMG+encodeURIComponent(it.en)+"/PNG?image_size=300x300";
      return '<div class="struct-card" style="background:#fff;border-radius:14px;padding:16px;margin-bottom:12px;box-shadow:0 2px 8px rgba(0,0,0,.06);border-left:4px solid var(--m-lav-d);">'+
        '<div style="display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:10px;">'+
          '<div><div style="font-size:16px;font-weight:700;color:var(--text-1);">'+it.name+'</div><div style="font-size:11px;color:var(--m-lav-d);margin-top:2px;">'+it.class+'</div><div style="font-size:10px;color:var(--text-3);margin-top:2px;">'+it.en+'</div></div>'+
          '<div class="struct-flip-btn" style="font-size:11px;color:var(--text-3);background:var(--m-lav-l);padding:3px 8px;border-radius:10px;cursor:pointer;">点击翻转</div>'+
        '</div>'+
        '<div style="display:flex;gap:12px;align-items:flex-start;">'+
          '<div style="flex-shrink:0;width:140px;height:140px;background:var(--m-mint-l);border-radius:10px;display:flex;align-items:center;justify-content:center;overflow:hidden;">'+
            '<img class="struct-img" src="'+imgUrl+'" alt="'+it.name+'结构式" loading="lazy" style="max-width:100%;max-height:100%;object-fit:contain;" '+
            'onerror="this.style.display=\'none\';this.parentElement.innerHTML=\'<div style=\\\'font-size:11px;color:var(--text-3);text-align:center;padding:8px;\\\'>结构式加载失败<br>见文字描述</div>\'" />'+
          '</div>'+
          '<div class="struct-front" style="flex:1;min-width:0;">'+
            '<div style="font-size:12px;color:var(--text-2);line-height:1.7;"><b style="color:var(--m-lav-d);">结构特征：</b><br>'+it.struct+'</div>'+
          '</div>'+
        '</div>'+
        '<div class="struct-back" style="display:none;margin-top:4px;">'+
          '<div style="font-size:12px;color:var(--text-2);line-height:1.7;margin-bottom:6px;"><b style="color:var(--m-pink-d);">构效关系：</b><br>'+it.features+'</div>'+
          '<div style="font-size:12px;color:var(--text-2);line-height:1.7;margin-bottom:6px;"><b style="color:var(--m-mint-d);">临床用途：</b>'+it.use+'</div>'+
          '<div style="font-size:12px;color:var(--m-yellow-d);line-height:1.7;padding:8px 10px;background:var(--m-yellow-l);border-radius:8px;"><b>记忆要点：</b><br>'+it.tip+'</div>'+
        '</div>'+
      '</div>';
    }).join("");
    // 绑定翻转：点击翻转按钮切换 正面结构/背面构效
    var cards=list.querySelectorAll(".struct-card");
    for(var i=0;i<cards.length;i++){
      (function(card){
        var flipBtn=card.querySelector(".struct-flip-btn");
        flipBtn.addEventListener("click",function(e){
          e.stopPropagation();
          var front=card.querySelector(".struct-front");
          var back=card.querySelector(".struct-back");
          var imgBox=card.querySelector(".struct-img")?.parentElement;
          if(back.style.display==="none"){
            front.style.display="none";
            back.style.display="block";
            if(imgBox)imgBox.style.display="none";
            flipBtn.textContent="点击返回";
          }else{
            front.style.display="block";
            back.style.display="none";
            if(imgBox)imgBox.style.display="flex";
            flipBtn.textContent="点击翻转";
          }
        });
      })(cards[i]);
    }
  }
  renderList();
  var tabs=document.querySelectorAll("#structTabs .file-tab");
  for(var i=0;i<tabs.length;i++)tabs[i].addEventListener("click",function(){
    var ts=document.querySelectorAll("#structTabs .file-tab");
    for(var j=0;j<ts.length;j++)ts[j].classList.remove("active");
    this.classList.add("active");
    catActive=parseInt(this.dataset.cat);
    renderList();
  });
}

// 学习打卡日历
function renderCalendar(){
  loadData("checkinDays",[]).then(function(days){
    var today=new Date();
    var y=today.getFullYear(),m=today.getMonth();
    var firstDay=new Date(y,m,1).getDay();
    var daysInMonth=new Date(y,m+1,0).getDate();
    var dayArr=days||[];
    var checkedToday=dayArr.indexOf(today.toDateString())>=0;
    // 连续打卡天数
    var streak=0;
    var d=new Date();
    while(dayArr.indexOf(d.toDateString())>=0){streak++;d.setDate(d.getDate()-1);}

    var monthNames=["1月","2月","3月","4月","5月","6月","7月","8月","9月","10月","11月","12月"];
    var weekDays=["日","一","二","三","四","五","六"];

    var calHtml='<div class="calendar-grid" style="display:grid;grid-template-columns:repeat(7,1fr);gap:4px;">';
    weekDays.forEach(function(w){calHtml+='<div style="text-align:center;font-size:11px;color:var(--text-3);padding:4px;">'+w+'</div>';});
    for(var i=0;i<firstDay;i++)calHtml+='<div></div>';
    for(var d=1;d<=daysInMonth;d++){
      var dateStr=new Date(y,m,d).toDateString();
      var isChecked=dayArr.indexOf(dateStr)>=0;
      var isToday=(d===today.getDate());
      calHtml+='<div class="cal-day'+(isChecked?" checked":"")+(isToday?" today":"")+'" data-date="'+dateStr+'" style="aspect-ratio:1;display:flex;align-items:center;justify-content:center;border-radius:8px;font-size:13px;cursor:pointer;'+
        (isChecked?'background:var(--m-mint-d);color:#fff;':'background:var(--m-mint-l);color:var(--text-2);')+
        (isToday?'box-shadow:0 0 0 2px var(--m-pink-d);':'')+'">'+d+'</div>';
    }
    calHtml+='</div>';

    $("main").innerHTML=
    '<div class="page active">'+
      '<div class="card" style="text-align:center;">'+
        '<div style="font-size:13px;color:var(--text-2);margin-bottom:4px;">'+y+'年 '+monthNames[m]+'</div>'+
        '<div style="display:flex;justify-content:center;gap:30px;margin:12px 0;">'+
          '<div><div style="font-size:28px;font-weight:700;color:var(--m-mint-d);">'+streak+'</div><div style="font-size:11px;color:var(--text-2);">连续打卡</div></div>'+
          '<div><div style="font-size:28px;font-weight:700;color:var(--m-pink-d);">'+dayArr.length+'</div><div style="font-size:11px;color:var(--text-2);">累计打卡</div></div>'+
        '</div>'+
        '<button id="checkinBtn" style="padding:10px 30px;border-radius:20px;font-size:14px;font-weight:600;'+(checkedToday?'background:var(--m-mint-l);color:var(--m-mint-d);':'background:var(--m-mint-d);color:#fff;')+'">'+(checkedToday?'✓ 今日已打卡':'今日打卡')+'</button>'+
      '</div>'+
      '<div class="card">'+
        '<div class="card-title"><span class="dot"></span>打卡日历</div>'+
        calHtml+
        '<div style="font-size:11px;color:var(--text-3);margin-top:10px;text-align:center;">点击日期可补签/取消，绿色为已打卡</div>'+
      '</div>'+
    '</div>';

    $("checkinBtn").addEventListener("click",function(){
      var ts=today.toDateString();
      var idx=dayArr.indexOf(ts);
      if(idx>=0){dayArr.splice(idx,1);toast("已取消今日打卡");}
      else{dayArr.push(ts);toast("🎉 打卡成功！");}
      saveData("checkinDays",dayArr).then(function(){renderCalendar();});
    });
    var cds=document.querySelectorAll(".cal-day[data-date]");
    for(var i=0;i<cds.length;i++)cds[i].addEventListener("click",function(){
      var ds=this.dataset.date;
      var idx=dayArr.indexOf(ds);
      if(idx>=0)dayArr.splice(idx,1);
      else dayArr.push(ds);
      saveData("checkinDays",dayArr).then(function(){renderCalendar();});
    });
  });
}

// 易错知识点
function renderMistakes(){
  loadData("mistakes",[]).then(function(mistakes){
    var activeSubject="all";
    $("main").innerHTML=
    '<div class="page active">'+
      '<div class="card"><div class="card-title"><span class="dot"></span>添加易错点</div>'+
        '<div class="recite-add"><input type="text" id="mkInput" placeholder="记一个易错知识点..." /><select id="mkSubject">'+SUBJECTS.map(function(s){return '<option value="'+s.name+'">'+s.name+'</option>';}).join("")+'</select><button id="mkAddBtn">+</button></div>'+
      '</div>'+
      '<div class="recite-subject-tabs" id="mkTabs"><div class="recite-subject-tab active" data-s="all">全部 '+mistakes.length+'</div>'+SUBJECTS.map(function(s){var c=mistakes.filter(function(m){return m.subject===s.name;}).length;return '<div class="recite-subject-tab" data-s="'+s.name+'">'+s.name+' '+c+'</div>';}).join("")+'</div>'+
      '<div id="mkList"></div>'+
    '</div>';

    function renderList(){
      var list=$("mkList");
      var show=activeSubject==="all"?mistakes:mistakes.filter(function(m){return m.subject===activeSubject;});
      if(show.length===0){list.innerHTML='<div class="empty-state"><div class="es-icon">⚠️</div><div class="es-text">暂无记录，把容易记错的点记下来</div></div>';return;}
      list.innerHTML=show.map(function(m){
        return '<div class="recite-item"><div class="ri-q"><span class="ri-tag">'+m.subject+'</span>'+m.text+'</div><div class="ri-actions"><button class="ri-btn" data-del="'+m.id+'" style="color:var(--danger);margin-left:auto;">删除</button></div></div>';
      }).join("");
      var ds=list.querySelectorAll("[data-del]");
      for(var i=0;i<ds.length;i++)ds[i].addEventListener("click",function(){
        var id=this.dataset.del;
        var idx=mistakes.findIndex(function(m){return m.id===id;});
        if(idx>=0){mistakes.splice(idx,1);saveData("mistakes",mistakes).then(function(){renderMistakes();});}
      });
    }
    renderList();
    var tabs=document.querySelectorAll("#mkTabs .recite-subject-tab");
    for(var i=0;i<tabs.length;i++)tabs[i].addEventListener("click",function(){
      var ts=document.querySelectorAll("#mkTabs .recite-subject-tab");
      for(var j=0;j<ts.length;j++)ts[j].classList.remove("active");
      this.classList.add("active");
      activeSubject=this.dataset.s;
      renderList();
    });
    $("mkAddBtn").addEventListener("click",function(){
      var input=$("mkInput");
      var t=input.value.trim();
      if(!t){toast("请输入内容");return;}
      mistakes.unshift({id:"mk_"+Date.now(),subject:$("mkSubject").value,text:t});
      saveData("mistakes",mistakes).then(function(){input.value="";renderMistakes();});
    });
    $("mkInput").addEventListener("keypress",function(e){if(e.key==="Enter")$("mkAddBtn").click();});
  });
}

function renderRecite(){
  loadData("reciteQuestions",DEFAULT_RECITE).then(function(questions){
    loadData("reciteAnswers",{}).then(function(answers){
      var activeSubject="all";
      var randomQ=null;
      $("main").innerHTML=
      '<div class="page active">'+
        '<div class="card" style="background:linear-gradient(135deg,var(--m-lav-d),var(--m-pink-d));color:#fff;text-align:center;padding:18px;">'+

            '<div style="font-size:13px;opacity:.9;">点击下方按钮，随机抽一道大题考考你</div>'+
          '</div>'+
          '<button id="randomQBtn" style="margin-top:10px;padding:8px 24px;border-radius:20px;font-size:13px;font-weight:600;background:#fff;color:var(--m-lav-d);border:none;">🎲 随机抽题</button>'+
        '</div>'+
        '<div class="recite-add"><input type="text" id="reciteAddInput" placeholder="添加自定义大题..." /><select id="reciteAddSubject">'+SUBJECTS.map(function(s){return '<option value="'+s.name+'">'+s.name+'</option>';}).join("")+'</select><button id="reciteAddBtn">+</button></div>'+
        '<div class="recite-subject-tabs" id="reciteTabs"><div class="recite-subject-tab active" data-s="all">全部 '+questions.length+'</div>'+SUBJECTS.map(function(s){var c=questions.filter(function(q){return q.subject===s.name;}).length;return '<div class="recite-subject-tab" data-s="'+s.name+'">'+s.name+' '+c+'</div>';}).join("")+'</div>'+
        '<div id="reciteList"></div>'+
      '</div>';

      function showRandomQ(){
        var pool=activeSubject==="all"?questions:questions.filter(function(q){return q.subject===activeSubject;});
        if(pool.length===0){toast("当前筛选下没有题目");return;}
        randomQ=pool[Math.floor(Math.random()*pool.length)];
        $("randomQArea").innerHTML=
          '<div style="font-size:14px;line-height:1.6;">'+
            '<div style="display:inline-block;font-size:11px;background:rgba(255,255,255,.25);padding:2px 8px;border-radius:10px;margin-bottom:8px;">'+randomQ.subject+'</div>'+
            '<div style="font-weight:600;">'+randomQ.q+'</div>'+
            '<div style="margin-top:8px;font-size:11px;opacity:.8;">在下方题库中找到这道题默写答案 ↓</div>'+
          '</div>';
      }
      $("randomQBtn").addEventListener("click",showRandomQ);

      function renderList(){
        var list=$("reciteList");
        var show=activeSubject==="all"?questions:questions.filter(function(q){return q.subject===activeSubject;});
        if(show.length===0){list.innerHTML='<div class="empty-state"><div class="es-icon">✍️</div><div class="es-text">暂无题目，添加一个吧</div></div>';return;}
        list.innerHTML=show.map(function(q){
          var ans=answers[q.id]||"";
          var isHighlight=randomQ&&q.id===randomQ.id;
          return '<div class="recite-item'+(isHighlight?' style="border:2px solid var(--m-lav-d);box-shadow:0 0 12px rgba(163,148,212,.3);"':'')+'"><div class="ri-q"><span class="ri-tag">'+q.subject+'</span>'+q.q+(isHighlight?' <span style="color:var(--m-lav-d);font-size:11px;">← 当前考你</span>':'')+'</div><textarea placeholder="在此默写你的答案..." data-ans="'+q.id+'">'+ans+'</textarea><div class="ri-saved '+(ans?"show":"")+'">'+(ans?"已保存 ✓":"")+'</div><div class="ri-actions"><button class="ri-btn save" data-save="'+q.id+'">保存</button><button class="ri-btn" data-clear="'+q.id+'">清空</button><button class="ri-btn" data-del-q="'+q.id+'" style="margin-left:auto;color:var(--danger);">删除题</button></div></div>';
        }).join("");
        var svs=list.querySelectorAll("[data-save]");
        for(var i=0;i<svs.length;i++)svs[i].addEventListener("click",function(){
          var id=this.dataset.save;
          var ta=list.querySelector('[data-ans="'+id+'"]');
          answers[id]=ta.value;
          saveData("reciteAnswers",answers).then(function(){toast("已保存");renderList();});
        });
        var cls=list.querySelectorAll("[data-clear]");
        for(var i=0;i<cls.length;i++)cls[i].addEventListener("click",function(){
          var id=this.dataset.clear;
          var ta=list.querySelector('[data-ans="'+id+'"]');
          ta.value="";
          delete answers[id];
          saveData("reciteAnswers",answers).then(function(){toast("已清空");renderList();});
        });
        var dqs=list.querySelectorAll("[data-del-q]");
        for(var i=0;i<dqs.length;i++)dqs[i].addEventListener("click",function(){
          if(confirm("删除这道题？")){
            var id=this.dataset.delQ;
            var idx=questions.findIndex(function(q){return q.id===id;});
            if(idx>=0){questions.splice(idx,1);saveData("reciteQuestions",questions).then(function(){renderRecite();});}
          }
        });
      }
      renderList();

      var tabs=document.querySelectorAll(".recite-subject-tab");
      for(var i=0;i<tabs.length;i++)tabs[i].addEventListener("click",function(){
        var ts=document.querySelectorAll(".recite-subject-tab");
        for(var j=0;j<ts.length;j++)ts[j].classList.remove("active");
        this.classList.add("active");
        activeSubject=this.dataset.s;
        renderList();
      });

      $("reciteAddBtn").addEventListener("click",function(){
        var input=$("reciteAddInput");
        var subject=$("reciteAddSubject").value;
        var q=input.value.trim();
        if(!q){toast("请输入题目");return;}
        questions.push({id:"r_"+Date.now(),subject:subject,q:q});
        saveData("reciteQuestions",questions).then(function(){input.value="";renderRecite();});
      });
    });
  });
}

function getAIReply(q){
  return new Promise(function(resolve){
    setTimeout(function(){
      resolve(generateReply(q));
    },500+Math.random()*500);
  });
}
function generateReply(q){
  var lower=q.toLowerCase();
  if(/片剂|制粒|压片/.test(q)){
    return "片剂制备的【湿法制粒工艺】流程：\n\n1. 原料粉碎与过筛（80-100目）\n2. 混合：药物+辅料（填充剂、崩解剂）\n3. 制软材：加黏合剂（淀粉浆/HPMC）\n4. 制湿颗粒：过14-20目筛\n5. 干燥：50-60℃，含水量2-4%\n6. 整粒：过筛使颗粒均匀\n7. 总混：加润滑剂、外加崩解剂\n8. 压片：调节片重和硬度\n9. 包衣（可选）\n\n质量控制：含量均匀度、重量差异、硬度、脆碎度、崩解时限。\n\n参考：《药剂学》方亮主编 人卫2023第9版";
  }
  if(/溶解度|增溶/.test(q)){
    return "影响药物溶解度的因素：\n\n【药物因素】\n• 分子结构、极性、晶型\n• 粒径（粒径越小溶解越快）\n\n【外部因素】\n• 温度（多数随温度升高增大）\n• 溶剂性质（相似相溶）\n• pH值（弱酸弱碱受影响大）\n• 同离子效应、盐效应\n\n【增加溶解度方法】\n制成盐类、混合溶剂、增溶剂、包合技术（环糊精）、固体分散体。\n\n参考：《药剂学》方亮主编 人卫2023";
  }
  if(/固体分散/.test(q)){
    return "【固体分散体】\n\n概念：药物以分子、无定形或微晶状态分散在载体中的体系。\n\n常用载体材料：\n• PEG（聚乙二醇）\n• PVP（聚维酮）\n• 泊洛沙姆\n• 纤维素衍生物（HPMC等）\n\n药物分散形式：\n• 分子状态\n• 无定形\n• 微晶\n\n制备方法：\n• 熔融法\n• 溶剂法\n• 溶剂-熔融法\n• 研磨法\n\n溶出机制：载体溶出带动药物溶出。\n\n参考：《药剂学》方亮主编 人卫2023";

function toast(msg){
  var t=$("toast");
  t.textContent=msg;
  t.classList.add("show");
  clearTimeout(t._timer);
  t._timer=setTimeout(function(){t.classList.remove("show");},2000);
}

// 自动检测更新：每次打开检查是否有新版本，有则自动刷新
(function(){
  var CHECK_URL="https://api.github.com/repos/Guhanshu0728/kaoyan/commits/main";
  var KEY="lastCommitSha";
  loadData(KEY,"").then(function(savedSha){
    fetch(CHECK_URL,{cache:"no-store"}).then(function(r){return r.json();}).then(function(d){
      var latestSha=d.sha||"";
      if(savedSha && latestSha && savedSha!==latestSha){
        // 有新版本，清缓存并刷新
        if("caches" in window){caches.keys().then(function(ks){ks.forEach(function(k){caches.delete(k);});});}
        saveData(KEY,latestSha).then(function(){
          location.reload(true);
        });
      }else if(latestSha){
        saveData(KEY,latestSha);
      }
    }).catch(function(){});
  });
})();
