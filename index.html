<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="format-detection" content="telephone=no">
<title>考研工作台 · 浙大药学</title>
<style>
:root{
  --m-pink:#f4b6c2;
  --m-pink-d:#e89aa8;
  --m-pink-l:#fde4ea;
  --m-blue:#a8c8e8;
  --m-blue-d:#7da8d4;
  --m-blue-l:#dceaf7;
  --m-mint:#a8dcc8;
  --m-mint-d:#7cc4a8;
  --m-mint-l:#d8f0e8;
  --m-lav:#c5b6e8;
  --m-lav-d:#a394d4;
  --m-lav-l:#ebe4f7;
  --m-yellow:#f7d99e;
  --m-yellow-d:#e8c279;
  --m-yellow-l:#fdf0d8;
  --m-peach:#fcc4a8;
  --m-peach-d:#f0a584;
  --m-peach-l:#fde8dc;
  --primary:#a8dcc8;
  --primary-d:#7cc4a8;
  --primary-l:#d8f0e8;
  --accent:#f4b6c2;
  --accent-d:#e89aa8;
  --danger:#e88a8a;
  --success:#8acca8;
  --text-1:#4a4a5a;
  --text-2:#7a7a8a;
  --text-3:#aaaaba;
  --bg:#f8f5fa;
  --card:#ffffff;
  --border:#eee8f0;
  --shadow:0 4px 16px rgba(180,160,200,.10);
  --shadow-lg:0 10px 30px rgba(180,160,200,.16);
  --radius:20px;
  --radius-sm:14px;
  --radius-xs:10px;
  --safe-top:env(safe-area-inset-top,0px);
  --safe-bottom:env(safe-area-inset-bottom,0px);
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{height:100%;overflow:hidden;}
body{
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","PingFang SC","Helvetica Neue",sans-serif;
  background:var(--bg);
  color:var(--text-1);
  font-size:15px;
  line-height:1.55;
  -webkit-font-smoothing:antialiased;
}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit;font-size:inherit;}
input,textarea,select{font-family:inherit;font-size:inherit;color:inherit;}
::-webkit-scrollbar{width:0;height:0;}
img{max-width:100%;}

#app{position:relative;width:100%;height:100vh;height:100dvh;overflow:hidden;}

.topbar{
  position:fixed;top:0;left:0;right:0;z-index:100;
  height:calc(54px + var(--safe-top));
  padding-top:var(--safe-top);
  background:linear-gradient(135deg,var(--m-mint-d),var(--m-blue-d));
  color:#fff;
  display:flex;align-items:center;
  padding-left:14px;padding-right:14px;
  box-shadow:0 2px 12px rgba(124,196,168,.2);
}
.topbar .menu-btn{
  width:38px;height:38px;
  display:flex;align-items:center;justify-content:center;
  border-radius:12px;transition:background .2s;
}
.topbar .menu-btn:active{background:rgba(255,255,255,.2);}
.topbar .menu-btn svg{width:22px;height:22px;}
.topbar .title{flex:1;text-align:center;font-size:16px;font-weight:600;letter-spacing:.3px;}
.topbar .right-slot{width:38px;}

.drawer-mask{
  position:fixed;inset:0;z-index:200;
  background:rgba(80,60,90,.35);
  opacity:0;visibility:hidden;
  transition:opacity .3s,visibility .3s;
  backdrop-filter:blur(3px);
}
.drawer-mask.open{opacity:1;visibility:visible;}
.drawer{
  position:fixed;top:0;left:0;bottom:0;z-index:201;
  width:270px;
  background:linear-gradient(180deg,#fff,var(--m-mint-l));
  color:var(--text-1);
  transform:translateX(-100%);
  transition:transform .32s cubic-bezier(.4,0,.2,1);
  display:flex;flex-direction:column;
  padding-top:var(--safe-top);
  box-shadow:4px 0 30px rgba(0,0,0,.1);
}
.drawer.open{transform:translateX(0);}
.drawer-header{
  padding:26px 20px 16px;
  background:linear-gradient(135deg,var(--m-mint-d),var(--m-blue-d));
  color:#fff;
  border-radius:0 0 24px 24px;
  margin-bottom:8px;
}
.drawer-header .avatar{
  width:50px;height:50px;border-radius:50%;
  background:rgba(255,255,255,.25);
  display:flex;align-items:center;justify-content:center;
  font-size:22px;font-weight:700;
  margin-bottom:10px;
}
.drawer-header .name{font-size:17px;font-weight:600;}
.drawer-header .sub{font-size:12px;opacity:.9;margin-top:3px;}

.drawer-nav{flex:1;overflow-y:auto;padding:8px 0 calc(16px + var(--safe-bottom));}
.nav-group-title{
  padding:12px 20px 6px;
  font-size:11px;font-weight:700;
  letter-spacing:1.5px;
  color:var(--text-3);
}
.nav-item{
  display:flex;align-items:center;gap:12px;
  padding:12px 20px;
  font-size:14px;
  transition:background .15s;
  position:relative;
}
.nav-item:active{background:var(--m-mint-l);}
.nav-item.active{background:var(--m-mint-l);}
.nav-item.active::before{
  content:'';position:absolute;left:0;top:10px;bottom:10px;
  width:3px;border-radius:0 3px 3px 0;background:var(--m-mint-d);
}
.nav-item .icon{width:32px;height:32px;border-radius:10px;display:flex;align-items:center;justify-content:center;background:var(--m-mint-l);color:var(--m-mint-d);flex-shrink:0;}
.nav-item .icon svg{width:18px;height:18px;}
.nav-item.sub-item{padding-left:48px;font-size:13px;padding-top:9px;padding-bottom:9px;}
.nav-item.sub-item .icon{width:28px;height:28px;border-radius:8px;font-size:12px;font-weight:600;}

.main{
  position:fixed;top:calc(54px + var(--safe-top));left:0;right:0;bottom:0;
  overflow-y:auto;-webkit-overflow-scrolling:touch;
}
.page{display:none;padding:14px 12px calc(90px + var(--safe-bottom));}
.page.active{display:block;animation:fadein .3s;}
@keyframes fadein{from{opacity:0;transform:translateY(6px);}to{opacity:1;transform:translateY(0);}}

.card{
  background:var(--card);
  border-radius:var(--radius);
  padding:16px;
  margin-bottom:12px;
  box-shadow:var(--shadow);
}
.card-title{
  font-size:15px;font-weight:600;
  color:var(--text-1);
  margin-bottom:12px;
  display:flex;align-items:center;gap:8px;
}
.card-title .dot{width:4px;height:15px;border-radius:2px;background:var(--m-mint-d);}

/* 首页 */
.hero-card{
  background:linear-gradient(135deg,var(--m-mint-d),var(--m-blue-d));
  color:#fff;
  border-radius:var(--radius);
  padding:20px 18px;
  margin-bottom:12px;
  position:relative;overflow:hidden;
  box-shadow:0 6px 20px rgba(124,196,168,.25);
}
.hero-card::after{
  content:'';position:absolute;right:-30px;top:-30px;
  width:130px;height:130px;border-radius:50%;
  background:rgba(255,255,255,.12);
}
.hero-card .label{font-size:12px;opacity:.9;margin-bottom:4px;}
.hero-card .countdown{font-size:40px;font-weight:700;line-height:1.1;}
.hero-card .countdown .unit{font-size:15px;font-weight:500;opacity:.85;margin-left:4px;}
.hero-card .exam-date{font-size:11px;opacity:.85;margin-top:6px;}
.hero-card .target{font-size:12px;opacity:.95;margin-top:4px;font-weight:500;}
.hero-card .progress-wrap{margin-top:12px;height:6px;border-radius:3px;background:rgba(255,255,255,.2);overflow:hidden;}
.hero-card .progress-bar{height:100%;border-radius:3px;background:linear-gradient(90deg,var(--m-yellow),#ffe4a8);}
.hero-card .progress-text{font-size:11px;opacity:.9;margin-top:5px;}

.stat-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px;}
.stat-card{background:var(--card);border-radius:var(--radius-sm);padding:14px 12px;box-shadow:var(--shadow);text-align:center;}
.stat-card .num{font-size:24px;font-weight:700;color:var(--m-blue-d);}
.stat-card .lbl{font-size:11px;color:var(--text-2);margin-top:3px;}

.quick-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:4px;}
.quick-item{
  background:var(--card);border-radius:var(--radius-sm);
  padding:12px 4px;text-align:center;box-shadow:var(--shadow);
  transition:transform .12s;
}
.quick-item:active{transform:scale(.95);}
.quick-item .qi-icon{width:34px;height:34px;border-radius:10px;margin:0 auto 5px;display:flex;align-items:center;justify-content:center;}
.quick-item .qi-icon svg{width:18px;height:18px;}
.quick-item .qi-label{font-size:11px;color:var(--text-2);}

.today-tasks-mini .task-item{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--border);}
.today-tasks-mini .task-item:last-child{border-bottom:none;}
.task-check{width:22px;height:22px;border-radius:50%;border:2px solid var(--m-mint);display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:all .2s;}
.task-check.done{background:var(--success);border-color:var(--success);}
.task-check svg{display:none;width:13px;height:13px;color:#fff;}
.task-check.done svg{display:block;}
.task-item .t-name{flex:1;font-size:14px;}
.task-item.done .t-name{text-decoration:line-through;color:var(--text-3);}
.task-item .t-tag{font-size:11px;padding:2px 8px;border-radius:8px;background:var(--m-mint-l);color:var(--m-mint-d);}

.subject-header{
  display:flex;align-items:center;gap:14px;
  border-radius:var(--radius);
  padding:18px;margin-bottom:14px;color:#fff;
}
.subject-header .sh-icon{width:48px;height:48px;border-radius:14px;background:rgba(255,255,255,.25);display:flex;align-items:center;justify-content:center;font-size:22px;font-weight:600;}
.subject-header .sh-info{flex:1;}
.subject-header .sh-name{font-size:18px;font-weight:600;}
.subject-header .sh-sub{font-size:12px;opacity:.9;margin-top:2px;}

.upload-zone{
  border:2px dashed var(--m-mint);
  border-radius:var(--radius-sm);
  padding:22px 16px;text-align:center;
  background:var(--m-mint-l);
  margin-bottom:12px;transition:all .2s;
}
.upload-zone:active{background:var(--m-mint);border-color:var(--m-mint-d);}
.upload-zone .uz-icon{width:42px;height:42px;margin:0 auto 6px;border-radius:50%;background:#fff;display:flex;align-items:center;justify-content:center;color:var(--m-mint-d);}
.upload-zone .uz-icon svg{width:22px;height:22px;}
.upload-zone .uz-text{font-size:14px;color:var(--text-1);font-weight:500;}
.upload-zone .uz-hint{font-size:12px;color:var(--text-3);margin-top:3px;}

.file-tabs{display:flex;gap:6px;margin-bottom:10px;overflow-x:auto;}
.file-tab{padding:6px 14px;border-radius:18px;font-size:12px;font-weight:500;background:var(--card);color:var(--text-2);border:1px solid var(--border);white-space:nowrap;transition:all .2s;}
.file-tab.active{background:var(--m-mint-d);color:#fff;border-color:var(--m-mint-d);}

.file-list{list-style:none;}
.file-item{display:flex;align-items:center;gap:10px;padding:12px;background:var(--card);border-radius:var(--radius-sm);margin-bottom:8px;box-shadow:var(--shadow);}
.file-item .fi-icon{width:38px;height:38px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:600;flex-shrink:0;}
.file-item .fi-icon.pdf{background:var(--m-peach-l);color:var(--m-peach-d);}
.file-item .fi-icon.video{background:var(--m-lav-l);color:var(--m-lav-d);}
.file-item .fi-info{flex:1;min-width:0;}
.file-item .fi-name{font-size:13px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.file-item .fi-meta{font-size:11px;color:var(--text-3);margin-top:2px;}
.file-item .fi-actions{display:flex;gap:5px;}
.file-item .fi-btn{width:32px;height:32px;border-radius:8px;display:flex;align-items:center;justify-content:center;background:var(--m-mint-l);color:var(--m-mint-d);}
.file-item .fi-btn:active{background:var(--m-mint);}
.file-item .fi-btn svg{width:16px;height:16px;}
.file-item .fi-btn.del{color:var(--danger);background:var(--m-pink-l);}

.empty-state{text-align:center;padding:28px 16px;color:var(--text-3);}
.empty-state .es-icon{font-size:36px;margin-bottom:6px;opacity:.6;}
.empty-state .es-text{font-size:13px;}

/* 计划 */
.plan-date{text-align:center;font-size:12px;color:var(--text-2);margin-bottom:12px;}
.plan-add{display:flex;gap:6px;margin-bottom:12px;}
.plan-add input{flex:1;padding:10px 12px;border:1px solid var(--border);border-radius:var(--radius-sm);background:var(--card);font-size:14px;outline:none;}
.plan-add input:focus{border-color:var(--m-mint-d);}
.plan-add select{padding:10px 6px;border:1px solid var(--border);border-radius:var(--radius-sm);background:var(--card);font-size:12px;color:var(--text-2);outline:none;}
.plan-add button{width:40px;background:var(--m-mint-d);color:#fff;border-radius:var(--radius-sm);font-size:20px;display:flex;align-items:center;justify-content:center;}
.plan-progress{display:flex;align-items:center;gap:10px;margin-bottom:12px;padding:14px;background:var(--m-mint-l);border-radius:var(--radius-sm);}
.plan-progress .pp-circle{position:relative;width:46px;height:46px;flex-shrink:0;}
.plan-progress .pp-circle svg{width:46px;height:46px;transform:rotate(-90deg);}
.plan-progress .pp-circle .pp-num{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:600;color:var(--m-mint-d);}
.plan-progress .pp-text{flex:1;}
.plan-progress .pp-text .pt-main{font-size:13px;font-weight:500;}
.plan-progress .pp-text .pt-sub{font-size:12px;color:var(--text-2);margin-top:2px;}
.plan-item{display:flex;align-items:center;gap:10px;padding:13px;background:var(--card);border-radius:var(--radius-sm);margin-bottom:8px;box-shadow:var(--shadow);animation:slidein .25s;}
@keyframes slidein{from{opacity:0;transform:translateX(-8px);}to{opacity:1;transform:translateX(0);}}
.plan-item .pi-check{width:24px;height:24px;border-radius:50%;border:2px solid var(--m-mint);flex-shrink:0;display:flex;align-items:center;justify-content:center;transition:all .2s;}
.plan-item.done .pi-check{background:var(--success);border-color:var(--success);}
.plan-item.done .pi-check svg{width:13px;height:13px;color:#fff;display:block;}
.pi-check svg{display:none;}
.plan-item .pi-content{flex:1;}
.plan-item .pi-name{font-size:14px;}
.plan-item.done .pi-name{text-decoration:line-through;color:var(--text-3);}
.plan-item .pi-tag{display:inline-block;font-size:11px;padding:2px 7px;border-radius:8px;margin-top:3px;background:var(--m-mint-l);color:var(--m-mint-d);}
.plan-item .pi-del{width:28px;height:28px;color:var(--text-3);display:flex;align-items:center;justify-content:center;}
.plan-item .pi-del:active{color:var(--danger);}
.plan-item .pi-del svg{width:16px;height:16px;}

/* 番茄 */
.pomodoro-wrap{text-align:center;padding:16px 0;}
.pomo-mode-tabs{display:flex;gap:6px;justify-content:center;margin-bottom:18px;}
.pomo-mode-tab{padding:6px 16px;border-radius:18px;font-size:12px;font-weight:500;background:var(--card);color:var(--text-2);box-shadow:var(--shadow);}
.pomo-mode-tab.active{background:var(--m-mint-d);color:#fff;}
.pomo-clock{width:210px;height:210px;margin:0 auto 20px;position:relative;}
.pomo-clock svg{width:100%;height:100%;transform:rotate(-90deg);}
.pomo-clock .pomo-ring-bg{fill:none;stroke:var(--m-mint-l);stroke-width:8;}
.pomo-clock .pomo-ring{fill:none;stroke:var(--m-mint-d);stroke-width:8;stroke-linecap:round;transition:stroke-dashoffset .8s linear;}
.pomo-clock .pomo-time{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;}
.pomo-clock .pomo-time .pt-time{font-size:42px;font-weight:300;color:var(--text-1);letter-spacing:2px;}
.pomo-clock .pomo-time .pt-label{font-size:12px;color:var(--text-3);margin-top:4px;}
.pomo-controls{display:flex;gap:14px;justify-content:center;}
.pomo-btn{width:54px;height:54px;border-radius:50%;display:flex;align-items:center;justify-content:center;box-shadow:var(--shadow-lg);transition:transform .15s;}
.pomo-btn:active{transform:scale(.92);}
.pomo-btn svg{width:22px;height:22px;}
.pomo-btn.primary{background:var(--m-mint-d);color:#fff;}
.pomo-btn.secondary{background:var(--card);color:var(--m-mint-d);}
.pomo-stats{display:flex;justify-content:center;gap:28px;margin-top:20px;padding:14px;background:var(--m-mint-l);border-radius:var(--radius-sm);}
.pomo-stat .ps-num{font-size:20px;font-weight:700;color:var(--m-mint-d);}
.pomo-stat .ps-lbl{font-size:11px;color:var(--text-2);margin-top:2px;}

/* 倒计时 */
.countdown-big{text-align:center;padding:28px 18px;border-radius:var(--radius);color:#fff;margin-bottom:12px;position:relative;overflow:hidden;background:linear-gradient(135deg,var(--m-pink-d),var(--m-lav-d));}
.countdown-big::after{content:'';position:absolute;right:-40px;bottom:-40px;width:150px;height:150px;border-radius:50%;background:rgba(255,255,255,.1);}
.countdown-big .cb-label{font-size:13px;opacity:.9;margin-bottom:6px;}
.countdown-big .cb-days{font-size:68px;font-weight:700;line-height:1;letter-spacing:2px;}
.countdown-big .cb-unit{font-size:18px;font-weight:500;opacity:.85;}
.countdown-big .cb-date{font-size:12px;opacity:.85;margin-top:8px;}
.cd-detail-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:12px;}
.cd-detail{background:var(--card);border-radius:var(--radius-sm);padding:14px 6px;text-align:center;box-shadow:var(--shadow);}
.cd-detail .cd-num{font-size:22px;font-weight:700;color:var(--m-blue-d);}
.cd-detail .cd-lbl{font-size:11px;color:var(--text-2);margin-top:3px;}
.cd-milestones .ms-item{display:flex;align-items:center;gap:10px;padding:11px 0;border-bottom:1px solid var(--border);}
.cd-milestones .ms-item:last-child{border-bottom:none;}
.cd-milestones .ms-dot{width:10px;height:10px;border-radius:50%;background:var(--m-yellow-d);flex-shrink:0;}
.cd-milestones .ms-item.passed .ms-dot{background:var(--success);}
.cd-milestones .ms-item .ms-info{flex:1;}
.cd-milestones .ms-item .ms-name{font-size:14px;font-weight:500;}
.cd-milestones .ms-item .ms-date{font-size:12px;color:var(--text-3);}
.cd-milestones .ms-item .ms-days{font-size:13px;font-weight:600;color:var(--m-mint-d);}

/* 速算 */
.calc-mode-tabs{display:flex;gap:6px;margin-bottom:12px;}
.calc-mode-tab{flex:1;padding:9px;border-radius:var(--radius-sm);text-align:center;font-size:12px;font-weight:500;background:var(--card);color:var(--text-2);box-shadow:var(--shadow);}
.calc-mode-tab.active{background:var(--m-mint-d);color:#fff;}
.calc-card{background:var(--card);border-radius:var(--radius);padding:22px;box-shadow:var(--shadow);text-align:center;}
.calc-question{font-size:38px;font-weight:700;color:var(--text-1);margin-bottom:18px;letter-spacing:2px;}
.calc-input{width:100%;padding:13px;font-size:22px;text-align:center;border:2px solid var(--border);border-radius:var(--radius-sm);outline:none;margin-bottom:12px;transition:border-color .2s;}
.calc-input:focus{border-color:var(--m-mint-d);}
.calc-input.correct{border-color:var(--success);background:var(--m-mint-l);}
.calc-input.wrong{border-color:var(--danger);background:var(--m-pink-l);}
.calc-submit{width:100%;padding:13px;background:var(--m-mint-d);color:#fff;border-radius:var(--radius-sm);font-size:14px;font-weight:500;}
.calc-stats-bar{display:flex;justify-content:space-around;margin-top:14px;padding:14px;background:var(--m-mint-l);border-radius:var(--radius-sm);}
.calc-stat .cs-num{font-size:18px;font-weight:700;color:var(--m-mint-d);}
.calc-stat .cs-lbl{font-size:11px;color:var(--text-2);margin-top:2px;}
.calc-feedback{font-size:13px;margin-top:8px;min-height:18px;}
.calc-feedback.right{color:var(--success);}
.calc-feedback.wrong{color:var(--danger);}

/* 默写 */
.recite-subject-tabs{display:flex;gap:6px;margin-bottom:12px;overflow-x:auto;}
.recite-subject-tab{padding:6px 13px;border-radius:16px;font-size:12px;white-space:nowrap;background:var(--card);color:var(--text-2);box-shadow:var(--shadow);}
.recite-subject-tab.active{background:var(--m-mint-d);color:#fff;}
.recite-item{background:var(--card);border-radius:var(--radius);padding:16px;box-shadow:var(--shadow);margin-bottom:12px;}

// 数据层 IndexedDB
var DB_NAME="ZJU_Kaoyan",DB_VERSION=1,db=null;
function openDB(){return new Promise(function(resolve,reject){
  if(!window.indexedDB){resolve(null);return;}
  var req=indexedDB.open(DB_NAME,DB_VERSION);
  req.onupgradeneeded=function(e){
    var d=e.target.result;
    if(!d.objectStoreNames.contains("files"))d.createObjectStore("files",{keyPath:"id"});
    if(!d.objectStoreNames.contains("data"))d.createObjectStore("data",{keyPath:"key"});
  };
  req.onsuccess=function(e){db=e.target.result;resolve(db);};
  req.onerror=function(e){resolve(null);};
});}
function dbPut(store,val){return new Promise(function(res){
  if(!db){res();return;}
  var tx=db.transaction(store,"readwrite");tx.objectStore(store).put(val);
  tx.oncomplete=function(){res();};tx.onerror=function(){res();};
});}
function dbGet(store,key){return new Promise(function(res){
  if(!db){res(null);return;}
  var tx=db.transaction(store,"readonly");var r=tx.objectStore(store).get(key);
  r.onsuccess=function(){res(r.result);};r.onerror=function(){res(null);};
});}
function dbGetAll(store){return new Promise(function(res){
  if(!db){res([]);return;}
  var tx=db.transaction(store,"readonly");var r=tx.objectStore(store).getAll();
  r.onsuccess=function(){res(r.result||[]);};r.onerror=function(){res([]);};
});}
function dbDelete(store,key){return new Promise(function(res){
  if(!db){res();return;}
  var tx=db.transaction(store,"readwrite");tx.objectStore(store).delete(key);
  tx.oncomplete=function(){res();};tx.onerror=function(){res();};
});}
function saveData(key,value){return dbPut("data",{key:key,value:value});}
function loadData(key,def){return dbGet("data",key).then(function(r){return r?r.value:def;});}

function renderSubjectPage(subjectId){
  var s=SUBJECTS.filter(function(x){return x.id===subjectId;})[0];

    var files=allFiles.filter(function(f){return f.subject===subjectId;});
    var pdfFiles=files.filter(function(f){return f.type==="pdf";});
    var videoFiles=files.filter(function(f){return f.type==="video";});
    var activeTab="all";

    $("main").innerHTML=
    '<div class="page active">'+
      '<div class="subject-header" style="background:'+s.grad+';">'+
        '<div class="sh-icon">'+s.icon+'</div>'+
        '<div class="sh-info"><div class="sh-name">'+s.name+'</div><div class="sh-sub">'+s.sub+' · '+files.length+' 个资料</div></div>'+
      '</div>'+
      (s.refs&&s.refs.length?'<div class="card" style="font-size:12px;color:var(--text-2);line-height:1.7;"><b style="color:var(--text-1)">📚 官方参考书目（浙大349指定）：</b>'+s.refs.map(function(r,i){return '<div style="margin-top:6px;padding:7px 9px;background:var(--m-mint-l);border-radius:8px;"><span style="color:var(--m-mint-d);font-weight:600;">'+(i+1)+'.</span> 《'+r.name+'》 '+r.author+'，'+r.pub+'，'+r.year+'</div>';}).join("")+'</div>':'')+
      '<div class="upload-zone" id="uploadZone">'+
        '<div class="uz-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg></div>'+
        '<div class="uz-text">点击上传学习资料</div>'+
        '<div class="uz-hint">支持 PDF 文档、视频文件（网课/真题/模拟题）</div>'+
        '<input type="file" id="fileInput" accept=".pdf,video/*" multiple style="display:none">'+
      '</div>'+
      '<div class="file-tabs" id="fileTabs">'+
        '<div class="file-tab active" data-tab="all">全部 '+files.length+'</div>'+
        '<div class="file-tab" data-tab="pdf">PDF '+pdfFiles.length+'</div>'+
        '<div class="file-tab" data-tab="video">视频 '+videoFiles.length+'</div>'+
      '</div>'+
      '<div class="file-list" id="fileList"></div>'+
    '</div>';

    function renderFileList(){
      var list=$("fileList");
      var show=files;
      if(activeTab==="pdf")show=pdfFiles;
      if(activeTab==="video")show=videoFiles;
      if(show.length===0){
        list.innerHTML='<div class="empty-state"><div class="es-icon">📚</div><div class="es-text">暂无资料，点击上方上传</div></div>';
        return;
      }
      list.innerHTML=show.map(function(f){
        var isPdf=f.type==="pdf";
        return '<div class="file-item">'+
          '<div class="fi-icon '+f.type+'">'+(isPdf?"PDF":"▶")+'</div>'+
          '<div class="fi-info"><div class="fi-name">'+f.name+'</div><div class="fi-meta">'+formatSize(f.size)+' · '+f.added+'</div></div>'+
          '<div class="fi-actions">'+
            '<div class="fi-btn" data-view="'+f.id+'"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7z"/><circle cx="12" cy="12" r="3"/></svg></div>'+
            '<div class="fi-btn del" data-del="'+f.id+'"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg></div>'+
          '</div>'+
        '</div>';
      }).join("");
      var vs=list.querySelectorAll("[data-view]");
      for(var i=0;i<vs.length;i++)vs[i].addEventListener("click",function(){viewFile(this.dataset.view);});
      var ds=list.querySelectorAll("[data-del]");
      for(var i=0;i<ds.length;i++)ds[i].addEventListener("click",function(){
        if(confirm("确定删除这个文件吗？")){
          var id=this.dataset.del;
          dbDelete("files",id).then(function(){toast("已删除");renderSubjectPage(subjectId);});
        }
      });
    }
    renderFileList();

    var tabs=document.querySelectorAll(".file-tab");
    for(var i=0;i<tabs.length;i++)tabs[i].addEventListener("click",function(){
      var ts=document.querySelectorAll(".file-tab");
      for(var j=0;j<ts.length;j++)ts[j].classList.remove("active");
      this.classList.add("active");
      activeTab=this.dataset.tab;
      renderFileList();
    });

    $("uploadZone").addEventListener("click",function(){$("fileInput").click();});
    $("fileInput").addEventListener("change",function(e){
      var fileList=e.target.files;
      var promises=[];
      for(var i=0;i<fileList.length;i++){
        var file=fileList[i];
        var id="f_"+Date.now()+"_"+Math.random().toString(36).slice(2,8);
        var type=(file.type.indexOf("pdf")>=0||file.name.toLowerCase().indexOf(".pdf")>=0)?"pdf":"video";
        promises.push(dbPut("files",{
          id:id,subject:subjectId,name:file.name,size:file.size,type:type,blob:file,
          added:new Date().toLocaleDateString("zh-CN",{month:"short",day:"numeric"})
        }));
      }
      Promise.all(promises).then(function(){toast("上传成功");renderSubjectPage(subjectId);});
    });
  });
}

function formatSize(b){
  if(b<1024)return b+"B";
  if(b<1048576)return(b/1024).toFixed(1)+"KB";
  return(b/1048576).toFixed(1)+"MB";
}

function viewFile(id){
  dbGet("files",id).then(function(f){
    if(!f)return;
    if(fileViewerUrl)URL.revokeObjectURL(fileViewerUrl);
    var url=URL.createObjectURL(f.blob);
    fileViewerUrl=url;
    $("viewerTitle").textContent=f.name;
    if(f.type==="pdf"){
      $("viewerBody").innerHTML='<iframe src="'+url+'#toolbar=0"></iframe>';
    }else{
      $("viewerBody").innerHTML='<video src="'+url+'" controls autoplay></video>';
    }
    $("viewerMask").classList.add("open");
  });
}
$("viewerClose").addEventListener("click",function(){
  $("viewerMask").classList.remove("open");
  $("viewerBody").innerHTML="";
  if(fileViewerUrl){URL.revokeObjectURL(fileViewerUrl);fileViewerUrl=null;}
});

function renderPlan(){
  loadData("plans",[]).then(function(plans){
    var today=new Date().toDateString();
    var todayPlans=plans.filter(function(p){return p.date===today;});
    var doneCount=todayPlans.filter(function(p){return p.done;}).length;
    var pct=todayPlans.length===0?0:Math.round(doneCount/todayPlans.length*100);

    $("main").innerHTML=
    '<div class="page active">'+
      '<div class="plan-date">'+new Date().toLocaleDateString("zh-CN",{year:"numeric",month:"long",day:"numeric",weekday:"long"})+'</div>'+
      '<div class="plan-progress">'+
        '<div class="pp-circle"><svg viewBox="0 0 46 46"><circle cx="23" cy="23" r="19" fill="none" stroke="var(--m-mint-l)" stroke-width="5"/><circle cx="23" cy="23" r="19" fill="none" stroke="var(--m-mint-d)" stroke-width="5" stroke-linecap="round" stroke-dasharray="'+(2*Math.PI*19)+'" stroke-dashoffset="'+(2*Math.PI*19*(1-pct/100))+'"/></svg><div class="pp-num">'+pct+'%</div></div>'+
        '<div class="pp-text"><div class="pt-main">今日完成 '+doneCount+'/'+todayPlans.length+'</div><div class="pt-sub">'+(pct===100?"全部完成，太棒了！":todayPlans.length===0?"添加你的第一个计划吧":"还有 "+(todayPlans.length-doneCount)+" 个任务待完成")+'</div></div>'+
      '</div>'+
      '<div class="plan-add"><input type="text" id="planInput" placeholder="添加学习任务..." /><select id="planSubject">'+SUBJECTS.map(function(s){return '<option value="'+s.name+'">'+s.name+'</option>';}).join("")+'<option value="通用" selected>通用</option></select><button id="planAddBtn">+</button></div>'+
      '<div id="planList"></div>'+
    '</div>';

    function renderPlanList(){
      var list=$("planList");
      if(todayPlans.length===0){list.innerHTML='<div class="empty-state"><div class="es-icon">🎯</div><div class="es-text">今日暂无计划</div></div>';return;}
      todayPlans.sort(function(a,b){return a.done-b.done;});
      list.innerHTML=todayPlans.map(function(p){
        return '<div class="plan-item '+(p.done?"done":"")+'" data-id="'+p.id+'">'+
          '<div class="pi-check"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><polyline points="20 6 9 17 4 12"/></svg></div>'+
          '<div class="pi-content"><div class="pi-name">'+p.name+'</div><span class="pi-tag">'+p.subject+'</span></div>'+
          '<div class="pi-del" data-del="'+p.id+'"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6"/></svg></div>'+
        '</div>';
      }).join("");
      var is=list.querySelectorAll("[data-id]");
      for(var i=0;i<is.length;i++)is[i].addEventListener("click",function(){
        var id=this.dataset.id;
        var p=plans.filter(function(x){return x.id===id;})[0];
        if(p){p.done=!p.done;saveData("plans",plans).then(function(){renderPlan();});}
      });
      var ds=list.querySelectorAll("[data-del]");
      for(var i=0;i<ds.length;i++)ds[i].addEventListener("click",function(e){
        e.stopPropagation();
        var id=this.dataset.del;
        var idx=plans.findIndex(function(x){return x.id===id;});
        if(idx>=0){plans.splice(idx,1);saveData("plans",plans).then(function(){renderPlan();});}
      });
    }
    renderPlanList();

    $("planAddBtn").addEventListener("click",function(){
      var input=$("planInput");
      var name=input.value.trim();
      if(!name){toast("请输入任务内容");return;}
      var subject=$("planSubject").value;
      plans.push({id:"p_"+Date.now(),name:name,subject:subject,done:false,date:today});
      saveData("plans",plans).then(function(){input.value="";renderPlan();});
    });
    $("planInput").addEventListener("keypress",function(e){if(e.key==="Enter")$("planAddBtn").click();});
  });
}

          pomodoroState.running=false;

        }else{
          pomodoroState.running=true;
          startBtn.innerHTML='<svg viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="4" width="4" height="16"/><rect x="14" y="4" width="4" height="16"/></svg>';
          skipBtn.style.display="flex";
          pomodoroTimer=setInterval(function(){
            pomodoroState.seconds--;
            if(pomodoroState.seconds<=0){
              clearInterval(pomodoroTimer);
              pomodoroState.running=false;
              startBtn.innerHTML='<svg viewBox="0 0 24 24" fill="currentColor"><polygon points="6 4 20 12 6 20"/></svg>';
              if(pomodoroState.mode==="focus"){
                loadData("pomoCount",0).then(function(c){
                  saveData("pomoCount",c+1).then(function(){
                    loadData("pomoToday_"+new Date().toDateString(),0).then(function(td){
                      saveData("pomoToday_"+new Date().toDateString(),td+1).then(function(){
                        toast("🍅 专注完成！该休息了");
                        renderPomodoro();
                      });
                    });
                  });
                });
              }else{
                toast("休息结束，继续加油！");
                renderPomodoro();
              }
              return;
            }
            updateDisplay();
          },1000);
        }
        updateDisplay();
      }
      startBtn.addEventListener("click",start);
      resetBtn.addEventListener("click",function(){
        if(pomodoroTimer){clearInterval(pomodoroTimer);pomodoroTimer=null;}
        pomodoroState.running=false;
        pomodoroState.seconds=pomodoroState.total;
        startBtn.innerHTML='<svg viewBox="0 0 24 24" fill="currentColor"><polygon points="6 4 20 12 6 20"/></svg>';
        skipBtn.style.display="none";
        updateDisplay();
      });
      skipBtn.addEventListener("click",function(){
        if(pomodoroTimer){clearInterval(pomodoroTimer);pomodoroTimer=null;}
        pomodoroState.running=false;
        if(pomodoroState.mode==="focus"){
          loadData("pomoCount",0).then(function(c){saveData("pomoCount",c+1).then(function(){toast("已跳过");renderPomodoro();});});
        }else{toast("已跳过");renderPomodoro();}
      });

      var tabs=document.querySelectorAll(".pomo-mode-tab");
      for(var i=0;i<tabs.length;i++)tabs[i].addEventListener("click",function(){
        if(pomodoroTimer){clearInterval(pomodoroTimer);pomodoroTimer=null;}
        var ts=document.querySelectorAll(".pomo-mode-tab");
        for(var j=0;j<ts.length;j++)ts[j].classList.remove("active");
        this.classList.add("active");
        pomodoroState.mode=this.dataset.mode;
        pomodoroState.total=parseInt(this.dataset.sec);
        pomodoroState.seconds=pomodoroState.total;
        pomodoroState.running=false;
        startBtn.innerHTML='<svg viewBox="0 0 24 24" fill="currentColor"><polygon points="6 4 20 12 6 20"/></svg>';
        skipBtn.style.display="none";
        updateDisplay();
      });
    });
  });
}

// 药分计算题练习
function genPhCalcQuestion(type){
  var q={};
  if(type==="titration"){
    var V=(Math.floor(Math.random()*20)+10).toFixed(1);
    var T=(Math.floor(Math.random()*50)+50)/10;
    var m=(Math.floor(Math.random()*200)+200)/100;
    q.text="称取样品 "+m+" g，用滴定液滴定，消耗 "+V+" mL，滴定度 T = "+T+" mg/mL。求含量百分含量（%）";
    q.answer=Math.round((V*T/1000)/m*10000)/100;
    q.formula="含量% = (V×T/m)×100% = ("+V+"×"+T+"/1000/"+m+")×100%";
  }else if(type==="uv"){
    var A=(Math.floor(Math.random()*40)+40)/100;
    var E=Math.floor(Math.random()*200)+300;
    var L=1;
    q.text="某药物溶液测得吸光度 A = "+A+"，吸收系数 E = "+E+"，液层厚度 L = "+L+" cm。求浓度 C（g/100mL）";
    q.answer=Math.round(A/(E*L)*10000)/10000;
    q.formula="C = A/(E×L) = "+A+"/("+E+"×"+L+")";
  }else if(type==="impurity"){
    var C=Math.floor(Math.random()*5)+1;
    var V=Math.floor(Math.random()*10)+2;
    var m=(Math.floor(Math.random()*20)+10)/10;
    q.text="杂质检查：标准溶液浓度 "+C+" μg/mL，取 "+V+" mL，供试品 "+m+" g。求杂质限量（%）";
    q.answer=Math.round(C*V/m/10000*10000)/100;
    q.formula="L = (C×V/m)×100% = ("+C+"×"+V+"/"+m+")/10000×100%";
  }else{
    var As=(Math.floor(Math.random()*40)+40)/100;
    var Ad=(Math.floor(Math.random()*40)+40)/100;
    var Cd=(Math.floor(Math.random()*50)+10)/10;
    q.text="对照品法：对照品吸光度 "+ad2(As)+"，浓度 "+Cd+" mg/mL；供试品吸光度 "+ad2(Ad)+"。求供试品浓度（mg/mL）";
    q.answer=Math.round(Ad/As*Cd*1000)/1000;
    q.formula="C样 = (A样/A对)×C对 = ("+ad2(Ad)+"/"+ad2(As)+")×"+Cd;
  }
  return q;
}
function ad2(n){return (Math.round(n*100)/100).toFixed(2);}

function renderPhCalc(){
  phcalcState.count=0;phcalcState.right=0;phcalcState.start=Date.now();
  phcalcState.type="titration";
  phcalcState.q=genPhCalcQuestion("titration");
  $("main").innerHTML=
  '<div class="page active">'+
    '<div class="card"><div class="card-title"><span class="dot"></span>题型选择</div><div class="calc-mode-tabs" id="phcTabs">'+
      '<div class="calc-mode-tab active" data-type="titration">滴定含量</div>'+
      '<div class="calc-mode-tab" data-type="uv">紫外吸收</div>'+
      '<div class="calc-mode-tab" data-type="impurity">杂质限量</div>'+
      '<div class="calc-mode-tab" data-type="compare">对照品法</div>'+
    '</div></div>'+
    '<div class="calc-card">'+
      '<div class="calc-question" id="phcQ" style="font-size:15px;line-height:1.7;">'+phcalcState.q.text+'</div>'+
      '<input type="number" class="calc-input" id="phcInput" placeholder="输入答案（保留相应小数）" step="0.0001">'+
      '<button class="calc-submit" id="phcSubmit">提交答案</button>'+
      '<div class="calc-feedback" id="phcFb"></div>'+
      '<div id="phcFormula" style="font-size:12px;color:var(--text-2);margin-top:8px;display:none;background:var(--m-mint-l);padding:10px;border-radius:8px;font-family:Georgia,serif;"></div>'+
    '</div>'+
    '<div class="calc-stats-bar">'+
      '<div class="calc-stat"><div class="cs-num" id="phcRight">0</div><div class="cs-lbl">正确</div></div>'+
      '<div class="calc-stat"><div class="cs-num" id="phcTotal">0</div><div class="cs-lbl">总数</div></div>'+
      '<div class="calc-stat"><div class="cs-num" id="phcRate">0%</div><div class="cs-lbl">正确率</div></div>'+
    '</div>'+
  '</div>';

  function refresh(){
    phcalcState.q=genPhCalcQuestion(phcalcState.type);
    $("phcQ").textContent=phcalcState.q.text;
    $("phcInput").value="";
    $("phcInput").className="calc-input";
    $("phcFb").textContent="";
    $("phcFb").className="calc-feedback";
    $("phcFormula").style.display="none";
  }
  function updateStats(){
    $("phcRight").textContent=phcalcState.right;
    $("phcTotal").textContent=phcalcState.count;
    $("phcRate").textContent=phcalcState.count===0?"0%":Math.round(phcalcState.right/phcalcState.count*100)+"%";
  }
  function submit(){
    var input=$("phcInput"),fb=$("phcFb"),f=$("phcFormula");
    var val=parseFloat(input.value);
    if(isNaN(val))return;
    phcalcState.count++;
    var ans=phcalcState.q.answer;
    var ok=Math.abs(val-ans)<Math.abs(ans)*0.02||Math.abs(val-ans)<0.01;
    if(ok){
      phcalcState.right++;
      input.className="calc-input correct";
      fb.textContent="✓ 正确！答案 "+ans;
      fb.className="calc-feedback right";
    }else{
      input.className="calc-input wrong";
      fb.textContent="✗ 正确答案 "+ans;
      fb.className="calc-feedback wrong";
    }
    f.textContent="推导："+phcalcState.q.formula;
    f.style.display="block";
    updateStats();
    setTimeout(refresh,2500);
  }
  $("phcSubmit").addEventListener("click",submit);
  $("phcInput").addEventListener("keypress",function(e){if(e.key==="Enter")submit();});
  var tabs=document.querySelectorAll("#phcTabs .calc-mode-tab");
  for(var i=0;i<tabs.length;i++)tabs[i].addEventListener("click",function(){
    var ts=document.querySelectorAll("#phcTabs .calc-mode-tab");
    for(var j=0;j<ts.length;j++)ts[j].classList.remove("active");
    this.classList.add("active");
    phcalcState.type=this.dataset.type;
    phcalcState.count=0;phcalcState.right=0;phcalcState.start=Date.now();
    refresh();updateStats();
  });
}

        '</div>'+
        '<button id="checkinBtn" style="padding:10px 30px;border-radius:20px;font-size:14px;font-weight:600;'+(checkedToday?'background:var(--m-mint-l);color:var(--m-mint-d);':'background:var(--m-mint-d);color:#fff;')+'">'+(checkedToday?'✓ 今日已打卡':'今日打卡')+'</button>'+
      '</div>'+
      '<div class="card">'+
        '<div class="card-title"><span class="dot"></span>打卡日历</div>'+
        calHtml+
        '<div style="font-size:11px;color:var(--text-3);margin-top:10px;text-align:center;">点击日期可补签/取消，绿色为已打卡</div>'+
      '</div>'+
    '</div>';

    $("checkinBtn").addEventListener("click",function(){
      var ts=today.toDateString();
      var idx=dayArr.indexOf(ts);
      if(idx>=0){dayArr.splice(idx,1);toast("已取消今日打卡");}
      else{dayArr.push(ts);toast("🎉 打卡成功！");}
      saveData("checkinDays",dayArr).then(function(){renderCalendar();});

    var cds=document.querySelectorAll(".cal-day[data-date]");

      saveData("checkinDays",dayArr).then(function(){renderCalendar();});
    });
  });

function getAIReply(q){
  return new Promise(function(resolve){
    setTimeout(function(){
      resolve(generateReply(q));
    },500+Math.random()*500);
  });
}
function generateReply(q){
  var lower=q.toLowerCase();
  if(/片剂|制粒|压片/.test(q)){
    return "片剂制备的【湿法制粒工艺】流程：\n\n1. 原料粉碎与过筛（80-100目）\n2. 混合：药物+辅料（填充剂、崩解剂）\n3. 制软材：加黏合剂（淀粉浆/HPMC）\n4. 制湿颗粒：过14-20目筛\n5. 干燥：50-60℃，含水量2-4%\n6. 整粒：过筛使颗粒均匀\n7. 总混：加润滑剂、外加崩解剂\n8. 压片：调节片重和硬度\n9. 包衣（可选）\n\n质量控制：含量均匀度、重量差异、硬度、脆碎度、崩解时限。\n\n参考：《药剂学》方亮主编 人卫2023第9版";
  }
  if(/溶解度|增溶/.test(q)){
    return "影响药物溶解度的因素：\n\n【药物因素】\n• 分子结构、极性、晶型\n• 粒径（粒径越小溶解越快）\n\n【外部因素】\n• 温度（多数随温度升高增大）\n• 溶剂性质（相似相溶）\n• pH值（弱酸弱碱受影响大）\n• 同离子效应、盐效应\n\n【增加溶解度方法】\n制成盐类、混合溶剂、增溶剂、包合技术（环糊精）、固体分散体。\n\n参考：《药剂学》方亮主编 人卫2023";
  }
  if(/固体分散/.test(q)){
    return "【固体分散体】\n\n概念：药物以分子、无定形或微晶状态分散在载体中的体系。\n\n常用载体材料：\n• PEG（聚乙二醇）\n• PVP（聚维酮）\n• 泊洛沙姆\n• 纤维素衍生物（HPMC等）\n\n药物分散形式：\n• 分子状态\n• 无定形\n• 微晶\n\n制备方法：\n• 熔融法\n• 溶剂法\n• 溶剂-熔融法\n• 研磨法\n\n溶出机制：载体溶出带动药物溶出。\n\n参考：《药剂学》方亮主编 人卫2023";
  }
  if(/β受体|beta|阻滞|普萘洛尔/.test(lower)){
    return "【β受体阻滞剂】药理作用与临床应用：\n\n药理作用：\n• 心脏：减慢心率、抑制心肌收缩力、降低心肌耗氧\n• 支气管：收缩平滑肌（β2阻断）\n• 代谢：抑制脂肪/糖原分解\n• 肾素：抑制释放，降低血压\n\n临床应用：\n• 高血压（合并心绞痛、心梗后）\n• 心绞痛、心肌梗死\n• 心律失常\n• 心力衰竭（稳定期小剂量）\n• 青光眼（噻吗洛尔）\n\n禁忌：支气管哮喘、严重心动过缓、II/III度房室传导阻滞。\n\n参考：《药理学》杨宝峰 人卫2018第9版";
  }
  if(/阿托品/.test(q)){
    return "【阿托品】\n\n作用机制：竞争性阻断M胆碱受体。\n\n药理作用：\n• 腺体：抑制分泌（唾液、汗、胃液）\n• 眼：散瞳、升高眼压、调节麻痹\n• 平滑肌：松弛内脏平滑肌\n• 心血管：解除迷走神经对心脏抑制，加快心率\n• 中枢：大剂量兴奋\n\n临床应用：\n• 解除平滑肌痉挛（胃肠绞痛）\n• 抑制腺体分泌（麻醉前给药）\n• 眼科（散瞳检查）\n• 抗心律失常（窦性心动过缓）\n• 解救有机磷中毒\n\n不良反应：口干、视力模糊、心悸、皮肤干燥；中毒出现中枢兴奋。\n\n参考：《药理学》杨宝峰 人卫2018";
  }
  if(/前药|prodrug/.test(lower)){
    return "【前药原理】\n\n概念：将活性药物修饰为无活性/低活性形式，体内经酶或化学作用转化为原药发挥疗效。\n\n目的：\n• 提高生物利用度\n• 增加稳定性\n• 降低毒副作用\n• 改善口感/顺应性\n• 靶向输送\n\n经典案例：\n• 氨苄西林→匹氨西林（酯化，口服吸收提高）\n• 奥司他韦（体内代谢为活性形式）\n• 左旋多巴（透血脑屏障后脱羧为多巴胺）\n\n设计要点：选择合适载体和可裂解键，确保体内转化效率。\n\n参考：《药物化学》徐云根主编 人卫2023";
  }
  if(/β-内酰胺|内酰胺|青霉素|头孢/.test(q)){
    return "【β-内酰胺类药物】\n\n化学性质：\n• β-内酰胺环是活性必需结构\n• 环张力大，易水解开环失活\n• 酸碱条件下不稳定\n\n分类：\n1. 青霉素类：青霉素G、氨苄西林、阿莫西林\n2. 头孢菌素类：一至五代\n3. 碳青霉烯类：亚胺培南、美罗培南\n4. 单环类：氨曲南\n5. β-内酰胺酶抑制剂：克拉维酸、舒巴坦\n\n构效关系：\n• β-内酰胺环必需\n• 与另一环稠合增强活性\n• 侧链影响抗菌谱和稳定性\n\n参考：《药物化学》徐云根主编 人卫2023";
  }
  if(/色谱|液相|HPLC|hplc/.test(q)){

// 路由
function renderPage(page){
  if(page==="home")renderHome();
  else if(page==="plan")renderPlan();
  else if(page==="pomodoro")renderPomodoro();
  else if(page==="countdown")renderCountdown();
  else if(page==="calendar")renderCalendar();
  else if(page==="formula")renderFormula();
  else if(page==="calctitle")renderPhCalc();
  else if(page==="mistakes")renderMistakes();
  else if(page==="recite")renderRecite();
  else if(page==="memo")renderMemo();
  else if(page==="ai")renderAI();
}

// 交互
function openDrawer(){$("drawer").classList.add("open");$("drawerMask").classList.add("open");}
function closeDrawer(){$("drawer").classList.remove("open");$("drawerMask").classList.remove("open");}
$("menuBtn").addEventListener("click",openDrawer);
$("drawerMask").addEventListener("click",closeDrawer);
var bbItems=document.querySelectorAll(".bb-item");
for(var i=0;i<bbItems.length;i++)bbItems[i].addEventListener("click",function(){goto(this.dataset.page);});

setInterval(function(){if(currentPage==="countdown")renderCountdown();},1000);

function toast(msg){
  var t=$("toast");
  t.textContent=msg;
  t.classList.add("show");
  clearTimeout(t._timer);
  t._timer=setTimeout(function(){t.classList.remove("show");},2000);
}

// 启动
openDB().then(function(){
  renderNav();
  renderHome();
});
